    renderAssessmentList();

}

function renderAssessmentSheet(asmtId){
  const a = getAssessmentById(asmtId);
  if (!a) { activeAssessmentId = null; renderAssessmentList(); return; }
  const students = getSortedStudents();
  const ranked = computeAssessmentRanking(asmtId);
  const totalStudents = data.students.length;
  const numStudents = ranked.length;
  const numSubjects = a.subjects.length;
  const entered = assessmentEntryCount(asmtId);
  const progressPct = totalStudents ? Math.round((entered/totalStudents) * 100) : 0;
  const passPct = Number(a.passPercent) || 40;
  const totalMax = assessmentMaxTotal(a);

  const subjectStats = a.subjects.map(sub => {
    const mx = Number(sub.max) || 0;
    let sum = 0, cnt = 0, hi = -1, lo = Infinity;
    data.students.forEach(s => {
      const v = getAssessmentRawMark(asmtId, s.id, sub.id);
      if (v === undefined) return;
      const n = (v === "A") ? 0 : Number(v);
      if (isNaN(n)) return;
      sum += n; cnt++;
      if (n > hi) hi = n;
      if (n < lo) lo = n;
    });
    return { subId: sub.id, avg: cnt ? Math.round((sum/cnt)*10)/10 : 0, hi: hi<0?0:hi, lo: lo===Infinity?0:lo, cnt };
  });

  const headCells = a.subjects.map(sub => {
    const mx = Number(sub.max) || 0;
    return `<th>${esc(sub.name)} <span class="muted" style="font-size:9px;font-weight:600">(${mx})</span></th>`;
  }).join("");

  const rows = ranked.map((item, i) => {
    const s = item.s;
    const r = item.r;
    const rowCls = (!r.passed && r.maxTotal > 0) ? "fail" : "";
    const markCells = a.subjects.map((sub, j) => {
      const tabIdx = j * numStudents + i + 1;
      const raw = getAssessmentRawMark(asmtId, s.id, sub.id);
      const mx = Number(sub.max) || 0;
      const displayVal = raw === undefined ? "" : (raw === "A" ? "A" : String(raw));
      const isAbsent = raw === "A";
      const cls = [];
      if (raw === undefined) cls.push("empty");
      if (raw === "A") cls.push("absent");
      if (typeof raw === "number" && mx > 0 && raw > mx) cls.push("overmax");
      const below33 = (r.subMarks.find(x => x.subId === sub.id) || {}).below33;
      return `<td class="marks-cell ${below33?'below33':''}" data-subid="${esc(sub.id)}">
        <div class="marks-wrap">
          <input type="text" value="${esc(displayVal)}" data-sid="${esc(s.id)}" data-subid="${esc(sub.id)}" tabindex="${tabIdx}"
            enterkeyhint="next" class="${cls.join(' ')}" placeholder="—"
            oninput="onMarkInput(event,'${esc(s.id)}','${esc(sub.id)}')"
            onblur="onMarkBlur(event,'${esc(s.id)}','${esc(sub.id)}')"
            onkeydown="onMarksKeydown(event,'${esc(s.id)}','${esc(sub.id)}')"
            ${af('mark')}>
          <button type="button" tabindex="-1" class="a-btn ${isAbsent?'on':''}" data-sid="${esc(s.id)}" data-subid="${esc(sub.id)}" onclick="toggleAbsent('${esc(s.id)}','${esc(sub.id)}')" title="Toggle Absent">A</button>
        </div>
      </td>`;
    }).join("");
    const pctClass = r.maxTotal > 0
      ? (r.pct >= 80 ? "pct-green" : r.pct >= passPct ? "pct-amber" : "pct-red")
      : "";
    const remarkVal = (data.assessmentRemarks[asmtId]||{})[s.id] || "";
    const remarkTab = numSubjects * numStudents + i + 1;
    return `<tr data-rid="${esc(s.id)}" class="${rowCls}">
      <td class="roll sc1">${esc(s.rollNo||"—")}</td>
      <td class="name sc2" title="${esc(s.name||"")}">${esc(s.name||"(no name)")}</td>
      ${markCells}
      <td class="total">${r.total}${r.maxTotal?" / "+r.maxTotal:""}</td>
      <td class="pct ${pctClass} ${(!r.passed && r.maxTotal>0)?'fail-pct':''}">${r.maxTotal>0?r.pct+"%":"—"}</td>
      <td class="result-cell">${resultCellHTML(s, r, a)}</td>
      <td class="rank">${r.maxTotal>0?ordinal(item.rank):"—"}</td>
      <td class="remark-cell"><input type="text" value="${esc(remarkVal)}" placeholder="—" tabindex="${remarkTab}" oninput="onRemarkInput(event,'${esc(s.id)}')" onblur="onRemarkBlur(event,'${esc(s.id)}')" ${af('remark')}></td>
    </tr>`;
  }).join("");

  const footAvgs = a.subjects.map(sub => {
    const st = subjectStats.find(x => x.subId === sub.id);
    return `<td>${st ? st.avg : "—"}</td>`;
  }).join("");
  const footHigh = a.subjects.map(sub => {
    const st = subjectStats.find(x => x.subId === sub.id);
    return `<td>${st && st.cnt ? st.hi : "—"}</td>`;
  }).join("");
  const footLow = a.subjects.map(sub => {
    const st = subjectStats.find(x => x.subId === sub.id);
    return `<td>${st && st.cnt ? st.lo : "—"}</td>`;
  }).join("");

  const chipsHTML = a.subjects.length === 0
    ? `<div class="muted" style="padding:8px 0">No subjects yet. Add one below.</div>`
    : `<div class="subj-chips">${a.subjects.map(sub => `
        <div class="subj-chip">
          <input type="text" class="subjNameInp" value="${esc(sub.name)}" placeholder="Subject" oninput="renameSubject('${esc(asmtId)}','${esc(sub.id)}', this.value)" onblur="renameSubject('${esc(asmtId)}','${esc(sub.id)}', this.value)" ${af('subName')}>
          <input type="number" min="1" value="${sub.max}" oninput="changeSubjectMax('${esc(asmtId)}','${esc(sub.id)}', this.value)" onblur="changeSubjectMax('${esc(asmtId)}','${esc(sub.id)}', this.value, true)" ${af('subMax')}>
          <button type="button" class="rmSubj" title="Remove subject" onclick="removeSubjectFromAssessment('${esc(asmtId)}','${esc(sub.id)}')">✕</button>
        </div>`).join("")}</div>`;

  const others = data.assessments.filter(x => x.id !== asmtId);
  const copyPickerHTML = copyPickerOpenFor === asmtId
    ? (others.length === 0
        ? `<div class="copy-picker"><div class="muted">No other assessments to copy from.</div><div class="actions"><button onclick="openCopyPicker('${esc(asmtId)}')">Close</button></div></div>`
        : `<div class="copy-picker">
            <div class="muted" style="margin-bottom:6px">Copy subjects from:</div>
            <div class="actions">
              ${others.map(o => `<button onclick="copySubjectsFrom('${esc(o.id)}')">${esc(o.name)} <span class="muted" style="font-weight:600">(${o.subjects.length})</span></button>`).join("")}
              <button onclick="openCopyPicker('${esc(asmtId)}')">Cancel</button>
            </div>
            <div class="muted" style="margin-top:6px">Existing subject names are skipped.</div>
          </div>`)
    : "";

  document.getElementById("results").innerHTML = `
    <div class="section-info">📊 <b>${esc(a.name)}</b> · Pass mark ${passPct}% · ${a.subjects.length} subject${a.subjects.length===1?'':'s'} · Total ${totalMax}. Enter marks below. Tap <b>A</b> for absent (counts as 0). The keyboard's <b>Next</b> key moves DOWN to the next student.</div>

    <div class="card no-print">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
        <button onclick="closeAssessment()">← All Assessments</button>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button onclick="renameAssessment('${esc(asmtId)}')">✎ Rename</button>
          <button class="remove" onclick="deleteAssessment('${esc(asmtId)}')" title="Delete Assessment">🗑 Delete</button>
        </div>
      </div>
      <h2 style="margin:6px 0 4px">${esc(a.name)}</h2>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">
        <span class="muted">Pass mark:</span>
        <input type="number" min="1" max="100" value="${passPct}" onchange="updatePassPercent(this.value)" style="width:80px;padding:6px 8px;font-size:13px">
        <span class="muted">%</span>
      </div>
      <div style="margin-top:12px">
        <div>Entered: <b>${entered}</b> of <b>${totalStudents}</b> students</div>
        <div class="asmt-bar" style="margin:8px 0"><div class="fill ${progressPct >= 100 ? '' : (progressPct > 0 ? 'partial' : '')}" style="width:${progressPct}%"></div></div>
        <div>Total max: <b>${totalMax}</b></div>
      </div>
    </div>

    <div class="card no-print">
      <h3 style="margin-top:0">Subjects</h3>
      ${chipsHTML}
      <div class="subj-add-row">
        <input type="text" id="subNewName" class="inp-name" placeholder="Subject name" ${af('subNewName')}>
        <input type="number" id="subNewMax" class="inp-max" placeholder="Max" inputmode="numeric" ${af('subNewMax')}>
        <button class="add" onclick="addSubjectInline()">+ Add Subject</button>
        ${others.length ? `<button onclick="openCopyPicker('${esc(asmtId)}')">📋 Copy subjects…</button>` : ""}
      </div>
      ${copyPickerHTML}
    </div>

    <div class="card">
      ${a.subjects.length === 0
        ? `<div class="empty-state"><span class="icon">📚</span>Add at least one subject above to start entering marks.</div>`
        : `<div class="res-wrap">
        <table>
          <thead>
            <tr>
              <th class="sc1">Roll</th>
              <th class="sc2" style="text-align:left">Name</th>
              ${headCells}
              <th>TOTAL</th>
              <th>%</th>
              <th>Result</th>
              <th>Rank</th>
              <th style="min-width:130px">Remarks</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr>
              <td class="sc1"></td>
              <td class="sc2" style="text-align:right;padding-right:6px">Average →</td>
              ${footAvgs}
              <td colspan="4"></td>
              <td></td>
            </tr>
            <tr>
              <td class="sc1"></td>
              <td class="sc2" style="text-align:right;padding-right:6px">Highest →</td>
              ${footHigh}
              <td colspan="4"></td>
              <td></td>
            </tr>
            <tr>
              <td class="sc1"></td>
              <td class="sc2" style="text-align:right;padding-right:6px">Lowest →</td>
              ${footLow}
              <td colspan="4"></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>`}
    </div>

    <div class="card no-print" style="margin-top:12px">
      <h3 style="margin-top:0">Print</h3>
      <div class="actions">
        <button class="primary" onclick="printClassResults()">🖨 Class Result Sheet</button>
        <button onclick="printReportCards()">🖨 Individual Report Cards</button>
        <button onclick="printMeritList()">🖨 Merit List</button>
      </div>
      <div class="muted" style="margin-top:10px;font-size:12.5px;line-height:1.55;color:#6E6656">
        A = Absent · ✱ = Manually Passed · Pass Mark: ${passPct}%
      </div>
    </div>`;
}

          <td><div class="rc-lbl">Rank</div><div class="rc-val">${r.maxTotal>0?ordinal(item.rank):"—"}</div></td>

        </tr>
      </table>
      <div class="rc-remarks">
        <b>Remarks</b>

async function createFund(){
  const nameEl = document.getElementById("nfName");
  const amtEl = document.getElementById("nfAmount");
  const dueEl = document.getElementById("nfDue");
  const name = (nameEl?.value || "").trim();
  const amtRaw = (amtEl?.value || "").trim();
  const amount = amtRaw === "" ? 0 : (Number(amtRaw) || 0);
  const dueDate = (dueEl?.value || "").trim();
  if (!name) { toast("Please enter a fund name.", "error"); return; }
  if (amtRaw !== "" && (isNaN(Number(amtRaw)) || Number(amtRaw) < 0)) { toast("Amount must be empty or a positive number.", "error"); return; }
  const f = { id: newFundId(), name, amount, dueDate, createdAt: Date.now() };
  data.funds.push(f);
  save();
  newFundFormOpen = false;
  activeFundId = f.id;
  localStorage.setItem("classroomActiveFund", f.id);
  renderFunds();
  toast("Fund created.", "success");
}
async function deleteFund(id){
  const f = getFundById(id);
  if (!f) return;
  const ok = await uiConfirm(`Delete the fund "${f.name}"?\n\nThis will also delete all its payment records. This cannot be undone (except via Undo).`, { title: "Delete Fund", yesText: "Delete", danger: true, icon: "🗑️" });
  if (!ok) return;
  data.funds = data.funds.filter(x => x.id !== id);
  delete data.fundPayments[id];
  if (activeFundId === id) { activeFundId = null; localStorage.removeItem("classroomActiveFund"); }
  save();
  renderFunds();
  toast("Fund deleted.", "success");
}
function onFundAmountInput(e, sid){
  const fundId = activeFundId;
  if (!fundId) return;
  const el = e.target;
  const raw = el.value.trim();
  const fund = getFundById(fundId);
  let num = 0;
  if (raw === "") num = 0;
  else {
    const n = Number(raw);
    if (isNaN(n) || n < 0) { el.value = ""; num = 0; }
    else num = n;
  }
  const patch = { amount: num };
  const cur = getFundPayment(fundId, sid) || {};
  if (num > 0 && !cur.date) patch.date = todayISO();
  if (num === 0 && !cur.note && !cur.exempt) patch.date = "";
  setFundPayment(fundId, sid, patch);
  quickSave();
  updateFundRow(sid);
  updateFundSummary();
}
function onFundAmountBlur(e, sid){ save(); }
function onFundDateInput(e, sid){
  if (!activeFundId) return;
  setFundPayment(activeFundId, sid, { date: e.target.value });
  quickSave();
  updateFundRow(sid);
}
function onFundDateBlur(){ save(); }
function onFundNoteInput(e, sid){
  if (!activeFundId) return;
  setFundPayment(activeFundId, sid, { note: e.target.value });
  quickSave();
}
function onFundNoteBlur(){ save(); }
function toggleFundExempt(sid){
  if (!activeFundId) return;
  const cur = getFundPayment(activeFundId, sid) || {};
  const next = !cur.exempt;
  setFundPayment(activeFundId, sid, { exempt: next, amount: 0, date: "", note: cur.note||"" });
  save();
  renderFunds();
}
async function markAllPaidFund(){
  if (!activeFundId) return;
  const fund = getFundById(activeFundId);
  if (!fund) return;
  const ok = await uiConfirm(`Mark all students as PAID for "${fund.name}" (each Rs ${fund.amount})?\n\nStudents marked Exempt will stay as Exempt.`, { title: "Mark All Paid", yesText: "Mark All", danger: false, icon: "✅" });
  if (!ok) return;
  const today = todayISO();
  getSortedStudents().forEach(s => {
    const cur = getFundPayment(activeFundId, s.id) || {};
    if (cur.exempt) return;
    setFundPayment(activeFundId, s.id, { amount: fund.amount, date: cur.date || today });
  });
  save();
  renderFunds();
  toast("All marked as paid.", "success");
}
function updateFundRow(sid){
  if (!activeFundId) return;
  const row = document.querySelector(`.fund-wrap tr[data-frid="${sid}"]`);
  if (!row) return;
  const st = getFundStudentStatus(activeFundId, sid);
  const amtCell = row.querySelector(".famt-cell");
  if (amtCell) {
    amtCell.classList.remove("below-target","at-target","exempt-cell");
    if (st.exempt) amtCell.classList.add("exempt-cell");
    else if (st.code === "PAID") amtCell.classList.add("at-target");
    else amtCell.classList.add("below-target");
  }
  const rollCell = row.querySelector(".sc1");
  const nameCell = row.querySelector(".sc2");
  [rollCell,nameCell].forEach(c => {
    if (!c) return;
    c.classList.remove("paid-cell","exempt-cell");
    if (st.exempt) c.classList.add("exempt-cell");
    else if (st.code === "PAID") c.classList.add("paid-cell");
  });
  const statCell = row.querySelector(".fstat-cell");
  if (statCell) {
    statCell.classList.remove("fstat-pending","fstat-partial","fstat-paid","fstat-exempt");
    if (st.exempt) { statCell.classList.add("fstat-exempt"); statCell.textContent = "EXEMPT"; }
    else if (st.code === "PAID") { statCell.classList.add("fstat-paid"); statCell.innerHTML = "PAID" + (st.overpaid ? ' <span class="overpaid-tri">▲</span>' : ''); }
    else if (st.code === "PARTIAL") { statCell.classList.add("fstat-partial"); statCell.textContent = "PARTIAL"; }
    else { statCell.classList.add("fstat-pending"); statCell.textContent = "PENDING"; }
  }
}
function updateFundSummary(){
  if (!activeFundId) return;
  const s = computeFundStats(activeFundId);
  const el = document.getElementById("fundSummaryRow");
  if (el) el.innerHTML = fundSummaryHTML(s);
}
function fundSummaryHTML(st){
  return `
    <span><b>Collected:</b> <span style="color:#2F6F4E">${fmtMoney(st.collected)}</span></span>
    ${st.variable ? "" : `<span><b>Pending:</b> <span style="color:#7F1D1D">${fmtMoney(st.pending)}</span></span>`}
    <span><b>Paid:</b> ${st.paid}</span>
    <span><b>Partial:</b> ${st.partial}</span>
    <span><b>Pending:</b> ${st.pend}</span>
    <span><b>Exempt:</b> ${st.exempt}</span>
    ${st.variable ? "" : `<span><b>Total Target:</b> ${fmtMoney(st.totalTarget)}</span>`}
    <span><b>Progress:</b> ${st.pct}%${st.variable ? " (paid)" : ""}</span>`;
}

function renderFunds(){
  if (!data.students.length) {
    document.getElementById("funds").innerHTML = `
      <div class="section-info">💰 <b>Funds.</b> Add students first, then come back to collect funds.</div>
      <div class="card"><div class="empty-state"><span class="icon">🎓</span>No students yet. Go to the Students tab to add them.</div></div>`;
    return;
  }
  if (!activeFundId) {
    const saved = localStorage.getItem("classroomActiveFund");
    if (saved && getFundById(saved)) activeFundId = saved;
  }
  if (activeFundId && getFundById(activeFundId)) {
    renderFundSheet(activeFundId);
  } else {
    activeFundId = null;
    renderFundList();
  }
}

function renderFundSheet(fundId){
  const fund = getFundById(fundId);
  if (!fund) { activeFundId = null; renderFundList(); return; }
  const students = getSortedStudents();
  const stats = computeFundStats(fundId);
  const overdue = fund.dueDate && fund.dueDate < todayKey() && stats.pct < 100;
  const overdueBadge = overdue ? `<span class="att-chip" style="background:#F8E4E1;color:#7F1D1D;border-color:#B23A32">⚠ Overdue</span>` : "";
  const dueLine = fund.dueDate ? `Due: ${esc(prettyShortDate(fund.dueDate))}` : "";

  const rows = students.map((s, i) => {
    const p = getFundPayment(fundId, s.id) || {};
    const st = getFundStudentStatus(fundId, s.id);
    const exempt = !!p.exempt;
    const amtVal = (p.amount !== undefined && p.amount !== "" && p.amount !== 0) ? p.amount : "";
    const dateVal = p.date || "";
    const noteVal = p.note || "";
    const amtCls = ["famt-cell"];
    if (exempt) amtCls.push("exempt-cell");
    else if (st.code === "PAID") amtCls.push("at-target");
    else amtCls.push("below-target");
    const statTxt = exempt ? "EXEMPT" : st.code;
    const statCls = "fstat-cell fstat-" + statTxt.toLowerCase();
    const overpaid = !exempt && st.code === "PAID" && st.overpaid;
    const rollNameCls = exempt ? "exempt-cell" : (st.code === "PAID" ? "paid-cell" : "");
    const tabBase = i + 1;
    return `<tr data-frid="${esc(s.id)}">
      <td class="sc1 ${rollNameCls}">${esc(s.rollNo||"—")}</td>
      <td class="sc2 ${rollNameCls}" style="text-align:left">${esc(s.name||"(no name)")}</td>
      <td class="${amtCls.join(' ')}">
        <div class="famt-wrap">
          <input type="text" inputmode="numeric" class="famt-inp" value="${esc(amtVal)}" placeholder="0"
            ${exempt ? "disabled" : ""}
            tabindex="${tabBase}"
            oninput="onFundAmountInput(event,'${esc(s.id)}')"
            onblur="onFundAmountBlur(event,'${esc(s.id)}')"
            ${af('famt')}>
          <button type="button" tabindex="-1" class="e-btn ${exempt?'on':''}" title="Toggle Exempt" onclick="toggleFundExempt('${esc(s.id)}')">E</button>
        </div>
      </td>
      <td class="${statCls}">${statTxt}${overpaid ? ' <span class="overpaid-tri">▲</span>' : ''}</td>
      <td class="fdate-cell">
        <input type="date" class="fdate-inp" value="${esc(dateVal)}" tabindex="${tabBase + 10000}"
          oninput="onFundDateInput(event,'${esc(s.id)}')"
          onblur="onFundDateBlur(event,'${esc(s.id)}')"
          ${af('fdate')}>
      </td>
      <td class="fnote-cell">
        <input type="text" class="fnote-inp" value="${esc(noteVal)}" placeholder="Optional note" tabindex="${tabBase + 20000}"
          oninput="onFundNoteInput(event,'${esc(s.id)}')"
          onblur="onFundNoteBlur(event,'${esc(s.id)}')"
          ${af('fnote')}>
      </td>
    </tr>`;
  }).join("");

  const amtDesc = stats.variable ? "variable amount" : `${fmtMoney(fund.amount)} per student`;
  const helpDesc = stats.variable ? "Type any amount to mark paid. Tap <b>E</b> to mark Exempt." : "Type amount to mark paid. Tap <b>E</b> to mark Exempt. Cells stay red until full amount is entered.";
  document.getElementById("funds").innerHTML = `
    <div class="section-info">💰 <b>${esc(fund.name)}</b> — ${amtDesc}${dueLine ? " · " + dueLine : ""}. ${helpDesc}</div>

    <div class="card no-print">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
        <button onclick="closeFund()">← All Funds</button>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="add" onclick="markAllPaidFund()">✓ Mark All Paid</button>
          <button class="remove" onclick="deleteFund('${esc(fundId)}')" title="Delete Fund">🗑 Delete Fund</button>
        </div>
      </div>
      <h2 style="margin:6px 0 4px">${esc(fund.name)}${overdueBadge}</h2>
      <div class="muted">${amtDesc} · ${stats.totalStudentsCounted} students counted${stats.exempt ? ` (${stats.exempt} exempt)` : ""}${dueLine ? " · " + dueLine : ""}</div>
      <div class="fund-bar" style="margin-top:10px"><div class="fill ${stats.pct >= 100 ? '' : (stats.pct > 0 ? 'partial' : '')}" style="width:${Math.min(100,stats.pct)}%"></div></div>
      <div style="margin-top:8px;font-size:12px;color:#6E6656" id="fundSummaryRow">${fundSummaryHTML(stats)}</div>
    </div>

    <div class="card">
      <div class="fund-wrap">
        <table>
          <thead>
            <tr>
              <th class="sc1">Roll</th>
              <th class="sc2" style="text-align:left">Name</th>
              <th style="min-width:100px">Amount</th>
              <th style="min-width:90px">Status</th>
              <th style="min-width:130px">Date</th>
              <th style="min-width:160px">Note</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="6" class="center">No students</td></tr>`}</tbody>
        </table>
      </div>
    </div>

    <div class="card no-print" style="margin-top:12px">
      <h3 style="margin-top:0">Print</h3>
      <div class="actions">
        <button class="primary" onclick="printFundCollection()">🖨 Collection Sheet</button>
        <button onclick="printFundPending()">🖨 Pending List</button>
      </div>
    </div>`;
}

        </tr>

    </table>

}

function printFundPending(){
  const fund = getFundById(activeFundId);
  if (!fund) return;
  const students = getSortedStudents();
  if (!students.length) { toast("No students.", "error"); return; }

  const variable = isVariableFund(fund);
  const pendingRows = [];
  let totalPending = 0;
  students.forEach(s => {
    const p = getFundPayment(fund.id, s.id) || {};
    if (p.exempt) return;
    const st = getFundStudentStatus(fund.id, s.id);
    if (st.code === "PAID") return;
    pendingRows.push({ s, st });
    if (!variable) totalPending += Math.max(0, st.target - st.amount);
  });

  let bodyHTML = "";
  if (!pendingRows.length) {
    bodyHTML = `<div class="no-absents">✅ Everyone has paid or is exempt.</div>`;
  } else {
    bodyHTML = `<table class="fund-print">
      <thead>
        <tr>
          <th style="width:6%">#</th>
          <th style="width:9%">Roll</th>
          <th style="width:32%">Name</th>
          <th style="width:16%">Paid</th>
          <th style="width:16%">Owed</th>
          <th style="width:21%">Note</th>
        </tr>
      </thead>
      <tbody>${pendingRows.map((row, i) => {
        const p = getFundPayment(fund.id, row.s.id) || {};
        const owed = variable ? "—" : Math.max(0, row.st.target - row.st.amount);
        return `<tr>
          <td class="center">${i+1}</td>
          <td class="center">${esc(row.s.rollNo||"—")}</td>
          <td class="name">${esc(row.s.name||"—")}</td>
          <td class="center">${esc(row.st.amount ? String(row.st.amount) : "—")}</td>
          <td class="center" style="font-weight:700;color:#991b1b">${esc(owed)}</td>
          <td>${esc(p.note||"")}</td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
  }

  const subtitle = variable ? "Students who haven't paid yet" : ("Total Owed: " + fmtMoney(totalPending));
  setPrint(`<div class="print-sheet">
    ${buildPrintHeaderHTML(fund.name + " — Pending List", subtitle)}
    ${bodyHTML}
  </div>`, "portrait");
}

async function downloadViewImage(){
  const sorted = getSortedStudents();
  if (!sorted.length) { toast("No students to save.", "info"); return; }
  const scale = 2;
  const F = "Arial, Helvetica, sans-serif";
  let logoImg = null;
  if (data.schoolLogo) { try { logoImg = await loadImage(data.schoolLogo); } catch(e) { logoImg = null; } }
  const pad = 30;
  const headerH = (data.academicYear && data.className) ? 170 : (data.academicYear || data.className ? 155 : 140);
  const headRowH = 44;
  const rowH = 44;
  const colWidths = [50, 110, 70, 200, 200, 120, 160, 130];
  const tableW = colWidths.reduce((a,b)=>a+b, 0);
  const totalW = pad*2 + tableW;
  const totalH = pad*2 + headerH + headRowH + sorted.length * rowH + 20;
  const canvas = document.createElement("canvas");
  canvas.width = totalW * scale;
  canvas.height = totalH * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, totalW, totalH);
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  let textLeftBound = pad;
  if (logoImg) {
    const maxLogoH = 70, maxLogoW = 70;
    const ratio = Math.min(maxLogoW / logoImg.width, maxLogoH / logoImg.height);
    const drawW = logoImg.width * ratio;
    const drawH = logoImg.height * ratio;
    ctx.drawImage(logoImg, pad, pad + (headerH - 60)/2, drawW, drawH);
    textLeftBound = pad + drawW + 12;
  }
  const textRightBound = totalW - pad;
  const centerX = (textLeftBound + textRightBound) / 2;
  let y = pad;
  ctx.fillStyle = "#000";
  ctx.font = `700 22px ${F}`;
  ctx.fillText(data.schoolName, centerX, y + 16);
  y += 32;
  const classSub = data.className ? `Class: ${data.className}` : "";
  const inchargeSub = data.inchargeName ? `Incharge: ${data.inchargeName}` : "";
  const line1 = [classSub, inchargeSub].filter(Boolean).join(" • ");
  if (line1) { ctx.font = `700 13px ${F}`; ctx.fillStyle = "#333"; ctx.fillText(line1, centerX, y + 8); y += 22; }
  if (data.academicYear) { ctx.font = `600 12px ${F}`; ctx.fillStyle = "#555"; ctx.fillText(data.academicYear, centerX, y + 8); y += 20; }
  ctx.font = `700 14px ${F}`; ctx.fillStyle = "#1e3a8a"; ctx.fillText("STUDENT LIST", centerX, y + 12);
  y = pad + headerH;
  const headers = ["#","Adm. No","Roll","Name","Father Name","Phone","Address","Notes"];
  ctx.fillStyle = "#e5e7eb"; ctx.fillRect(pad, y, tableW, headRowH);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
  let x = pad; ctx.fillStyle = "#000"; ctx.font = `700 12px ${F}`;
  headers.forEach((h, i) => { ctx.strokeRect(x, y, colWidths[i], headRowH); ctx.fillText(h, x + colWidths[i]/2, y + headRowH/2); x += colWidths[i]; });
  y += headRowH;
  sorted.forEach((s, idx) => {
    x = pad;
    ctx.fillStyle = idx % 2 === 0 ? "#ffffff" : "#f8fafc";
    ctx.fillRect(pad, y, tableW, rowH);
    ctx.strokeStyle = "#000"; ctx.fillStyle = "#000"; ctx.font = `600 11.5px ${F}`;
    const cells = [String(idx+1), s.admissionNo||"—", s.rollNo||"—", s.name||"—", s.fatherName||"—", s.phone||"—", s.address||"—", s.notes||"—"];
    cells.forEach((val, i) => {
      ctx.strokeRect(x, y, colWidths[i], rowH);
      if (i === 3 || i === 4 || i === 6 || i === 7) {
        ctx.textAlign = "left";
        const maxW = colWidths[i] - 10;
        const words = String(val).split(/\s+/);
        let line = "", lines = [];
        words.forEach(w => {
          const test = line ? line + " " + w : w;
          if (ctx.measureText(test).width <= maxW) line = test;
          else { if (line) lines.push(line); line = w; }
        });
        if (line) lines.push(line);
        if (lines.length > 2) lines = lines.slice(0, 2);
        const lineH = 13;
        const totalTextH = lines.length * lineH;
        const startY = y + rowH/2 - totalTextH/2 + lineH/2 - 1;
        lines.forEach((ln, li) => ctx.fillText(ln, x + 5, startY + li * lineH));
        ctx.textAlign = "center";
      } else {
        ctx.fillText(val, x + colWidths[i]/2, y + rowH/2);
      }
      x += colWidths[i];
    });
    y += rowH;
  });
  canvas.toBlob(blob => {
    if (!blob) { toast("Could not create image.", "error"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `students-${stamp}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast("Image saved.", "success");
  }, "image/png");
}

function importBackup(event){
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const payload = JSON.parse(e.target.result);
      let imported = null;
      if (payload.app === "ClassroomManager" && payload.data) imported = payload.data;
      else if (payload.students) imported = payload;
      else throw new Error("Not a valid backup file");
      const ok = await uiConfirm("Replace current data with the imported backup?", { title: "Import Backup", yesText: "Import", danger: true, icon: "💾" });
      if (!ok) return;
      data = imported;
      if (data.schoolName === undefined) data.schoolName = "Your School Name";
      if (data.academicYear === undefined) data.academicYear = "";
      if (data.className === undefined) data.className = "";
      if (data.inchargeName === undefined) data.inchargeName = "";
      if (data.schoolLogo === undefined) data.schoolLogo = "";
if (data.printSize === undefined) data.printSize = "m";
if (data.printNote === undefined) data.printNote = "";
if (data.forceOrientation === undefined) data.forceOrientation = "";
      if (!Array.isArray(data.students)) data.students = [];
      if (!data.attendance || typeof data.attendance !== "object") data.attendance = {};
      if (!Array.isArray(data.assessments)) data.assessments = [];
      if (!data.assessmentResults || typeof data.assessmentResults !== "object") data.assessmentResults = {};
      if (!data.assessmentManualPass || typeof data.assessmentManualPass !== "object") data.assessmentManualPass = {};
      if (!data.assessmentRemarks || typeof data.assessmentRemarks !== "object") data.assessmentRemarks = {};
      if (!Array.isArray(data.funds)) data.funds = [];
      if (!data.fundPayments || typeof data.fundPayments !== "object") data.fundPayments = {};
      delete data.subjects; delete data.results; delete data.manualPass; delete data.remarks; delete data.passPercent;
      data.assessments = data.assessments.map(a => {
        const id = a.id || ("asmt_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,6));
        const subs = Array.isArray(a.subjects) ? a.subjects.map(s => ({
          id: s.id || ("asub_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,6)),
          name: String(s.name||"Subject"),
          max: Number(s.max) || 100
        })) : [];
        return { id, name: String(a.name||"Assessment"), passPercent: Number(a.passPercent) || 40, subjects: subs, createdAt: a.createdAt || Date.now() };
      });
      data.funds = data.funds.map(f => ({
        id: f.id || ("fund_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,6)),
        name: String(f.name||"Fund"),
        amount: Number(f.amount)||0,
        dueDate: f.dueDate||"",
        createdAt: f.createdAt||Date.now()
      }));
      data.students.forEach(s => { delete s.className; });
      Object.keys(data.attendance).forEach(k => {
        const d = data.attendance[k];
        if (d && d.status && typeof d.status === "object") {
          Object.keys(d.status).forEach(sid => { if (d.status[sid] === "H") d.status[sid] = "L"; });
        }
      });
      save();
      updateHeaderSub();
      toast("Backup imported successfully.", "success");
      show("dashboard");
    } catch (err) {
      toast("Could not import: " + err.message, "error");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

/* ================ CLOSE APP ================ */
async function closeApp(){
  const ok = await uiConfirm(
    "Close the app now?\n\nAll data is already saved.",
    { title: "Close App", yesText: "Close", danger: true, icon: "✕" }
  );
  if (!ok) return;

  // Final save in case anything is pending
  try { syncPendingDOM(); save(); } catch(e){}

  // 1) Try native close (works when the app is a PWA or script-opened)
  try { window.close(); } catch(e){}

  // 2) If still here, silently collapse any history entries then try again
  setTimeout(() => {
    const steps = history.length - 1;
    if (steps > 0) {
      try { history.go(-steps); } catch(e){}
    }
    setTimeout(() => {
      try { window.close(); } catch(e){}
      // 3) Last resort: navigate to a blank page.
      //    The WebView now has only 1 history entry, so its back/close
      //    button exits on the very next press.
      setTimeout(() => {
        if (!document.hidden) {
          try { location.replace("about:blank"); } catch(e){}
        }
      }, 200);
    }, 250);
  }, 150);
}

  const isRefresh = sessionStorage.getItem("classroomSessionActive") === "1";
  let safe;
  if (isRefresh) {
    const t = localStorage.getItem("classroomTab") || "dashboard";
    safe = ALL_TABS.includes(t) ? t : "dashboard";
  } else {
    safe = "dashboard";
    sessionStorage.setItem("classroomSessionActive", "1");
  }
  localStorage.setItem("classroomTab", safe);
  show(safe, true);
  try {
    history.replaceState(
      {view:safe, depth:0, activeAssessmentId:activeAssessmentId||null, activeFundId:activeFundId||null},
      "",
      location.href
    );
  } catch(e){}
})();
updateUndoRedoButtons();
updateAttendanceBadges();

/* ==== Header hide on scroll (mobile) ==== */
(function(){
  let lastY = 0, hidden = false;
  const header = document.getElementById("appHeader");
  window.addEventListener("scroll", () => {
    if (window.innerWidth > 800) {
      if (hidden) { header.classList.remove("hidden"); hidden = false; }
      lastY = window.scrollY;
      return;
    }
    const y = window.scrollY;
    if (y > 80 && y > lastY + 6 && !hidden) { header.classList.add("hidden"); hidden = true; }
    else if (y < lastY - 6 && hidden) { header.classList.remove("hidden"); hidden = false; }
    lastY = y;
  }, { passive: true });
})();

/* ==== Browser back button support ==== */
window.addEventListener("popstate", function(e){
  if (e.state && e.state.view) {
    _navDepth = e.state.depth !== undefined ? e.state.depth : Math.max(0, _navDepth - 1);
    // Sync sub-state
    const newAssessId = e.state.activeAssessmentId || null;
    const newFundId = e.state.activeFundId || null;
    let needRender = false;
    if (newAssessId !== activeAssessmentId) {
      activeAssessmentId = newAssessId;
      if (activeAssessmentId) localStorage.setItem("classroomActiveAssessment", activeAssessmentId);
      else localStorage.removeItem("classroomActiveAssessment");
      needRender = true;
    }
    if (newFundId !== activeFundId) {
      activeFundId = newFundId;
      if (activeFundId) localStorage.setItem("classroomActiveFund", activeFundId);
      else localStorage.removeItem("classroomActiveFund");
      needRender = true;
    }
    show(e.state.view, true);
  } else {
    _navDepth = 0;
    show("dashboard", true);
  }
});

/* ================ CLASS SNAPSHOT (self-installing) ================ */
function classAttendanceForMonth(mk){
  const [y, m] = mk.split("-").map(Number);
  const days = getMonthDays(y, m-1);
  const today = todayKey();
  let p = 0, a = 0;
  days.forEach(k => {
    if (k > today) return;
    const day = data.attendance[k];
    if (!day || day.holiday) return;
    data.students.forEach(s => {
      const jk = s.createdAt ? dateKey(new Date(s.createdAt)) : null;
      if (jk && k < jk) return;
      const st = day.status[s.id] || "P";
      if (st === "P") p++;
      else if (st === "A") a++;
    });
  });
  const denom = p + a;
  return { p, a, denom, pct: denom ? Math.round((p/denom)*100) : 0 };
}
function classAttendanceThisMonth(){ return classAttendanceForMonth(todayKey().slice(0,7)); }
function studentHasMarks(asmtId, sid){
  const r = data.assessmentResults[asmtId];
  if (!r) return false;
  const row = r[sid];
  if (!row) return false;
  return Object.keys(row).length > 0;
}
function classAverageForAssessment(asmtId){
  const ranked = computeAssessmentRanking(asmtId);
  const entered = ranked.filter(x => x.r.maxTotal > 0 && studentHasMarks(asmtId, x.s.id));
  if (!entered.length) return { avg: 0, passRate: 0, entered: 0, passed: 0, total: ranked.length };
  const sumTotal = entered.reduce((s, x) => s + x.r.total, 0);
  const sumMax = entered.reduce((s, x) => s + x.r.maxTotal, 0);
  const avg = sumMax > 0 ? Math.round((sumTotal/sumMax)*1000)/10 : 0;
  const passed = entered.filter(x => x.r.passed).length;
  const passRate = entered.length ? Math.round((passed/entered.length)*100) : 0;
  return { avg, passRate, entered: entered.length, passed, total: ranked.length };
}
function classFundsSummary(){
  let collected = 0, target = 0, paidCount = 0, totalCounted = 0;
  data.funds.forEach(f => {
    const st = computeFundStats(f.id);
    collected += st.collected;
    target += st.totalTarget;
    paidCount += st.paid;
    totalCounted += st.totalStudentsCounted;
  });
  const pct = target > 0 ? Math.round((collected/target)*100) : 0;
  return { collected, target, pct, paidCount, totalCounted, fundCount: data.funds.length };
}
function dashboardClassSnapshotHTML(){
  if (!data.students.length) return "";
  const att = classAttendanceThisMonth();
  const latestAsmt = data.assessments.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0))[0];
  const asmtStats = latestAsmt ? classAverageForAssessment(latestAsmt.id) : null;
  const funds = classFundsSummary();

  const thisMk = todayKey().slice(0,7);
  const [ty, tm] = thisMk.split("-").map(Number);
  const lastMDate = new Date(ty, tm - 2, 1);
  const lastMk = `${lastMDate.getFullYear()}-${String(lastMDate.getMonth()+1).padStart(2,"0")}`;
  const lastAtt = classAttendanceForMonth(lastMk);
  let trendHTML = "";
  if (lastAtt.denom > 0 && att.denom > 0) {
    const diff = att.pct - lastAtt.pct;
    if (diff >= 2) trendHTML = `<span style="color:#2F6F4E;font-size:11px;font-weight:700">▲ ${diff}% vs last month</span>`;
    else if (diff <= -2) trendHTML = `<span style="color:#B23A32;font-size:11px;font-weight:700">▼ ${Math.abs(diff)}% vs last month</span>`;
    else trendHTML = `<span class="muted" style="font-size:11px">— steady vs last month</span>`;
  }

  return `<div class="card" style="border-left:4px solid #2F6F4E">
    <h3>📊 Class Snapshot</h3>
    <div class="muted" style="margin-bottom:10px">How your class is doing right now.</div>
    <div class="grid" style="margin-bottom:0">
      <div class="stat"><b>${att.denom ? att.pct + "%" : "—"}</b>Attendance<div style="margin-top:4px">${trendHTML}</div></div>
      <div class="stat"><b>${asmtStats && asmtStats.entered ? asmtStats.avg + "%" : "—"}</b>Latest Test Avg<div class="muted" style="font-size:11px;margin-top:4px">${latestAsmt ? esc(latestAsmt.name) : "No assessments yet"}</div></div>
      <div class="stat"><b>${asmtStats && asmtStats.entered ? asmtStats.passRate + "%" : "—"}</b>Pass Rate<div class="muted" style="font-size:11px;margin-top:4px">${asmtStats && asmtStats.entered ? `${asmtStats.passed} of ${asmtStats.entered} above pass` : "—"}</div></div>
      <div class="stat"><b>${funds.fundCount ? funds.pct + "%" : "—"}</b>Funds Collected<div class="muted" style="font-size:11px;margin-top:4px">${funds.fundCount ? fmtMoney(funds.collected) : "No funds yet"}</div></div>
    </div>
  </div>`;
}
