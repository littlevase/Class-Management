<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#2F6F4E">
<title>Classroom Manager — Students</title>
<style>html,body{margin:0;padding:0;min-height:100%}html{background:#F6F4EF}html.dark-preload,html.dark-preload body{background:#1A1815!important;color:#EFE9DD!important}</style>
<script>
(function(){try{var d=localStorage.getItem("classroomDark")==="1";if(d)document.documentElement.classList.add("dark-preload");else document.documentElement.classList.remove("dark-preload")}catch(e){}})();
</script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#F6F4EF;color:#232019;transition:background .2s,color .2s;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.2px;margin:0 0 .4em}
header{background:#FFFFFF;color:#232019;padding:14px 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid #E5DFD0;transition:transform .25s ease;flex:0 0 auto}
header.hidden{transform:translateY(-100%)}header h1{margin:0;font-size:20px;color:#232019;font-family:Georgia,serif}header small{color:#6E6656}
nav#nav{position:sticky;top:61px;z-index:19;background:#FFFFFF;border-bottom:1px solid #E5DFD0;padding:8px;display:flex;gap:7px;overflow:auto;flex:0 0 auto}
button{border:0;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer;color:#232019;background:#EFEBE2;font-family:inherit}
nav#nav button{white-space:nowrap;background:transparent;color:#6E6656}
nav#nav button:hover{background:#F8F5EE;color:#232019}
nav#nav button.on{background:#EFEBE2;color:#232019}
nav#nav button.nav-badge{position:relative}
nav#nav button.nav-badge::after{content:"";position:absolute;top:6px;right:10px;width:8px;height:8px;border-radius:50%;background:#B23A32;box-shadow:0 0 0 2px #FFFFFF}
.bottom-nav button.nav-badge{position:relative}
.bottom-nav button.nav-badge::after{content:"";position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:#B23A32;box-shadow:0 0 0 2px #FFFFFF}
body.dark nav#nav button.nav-badge::after,
body.dark .bottom-nav button.nav-badge::after{background:#E06A5F;box-shadow:0 0 0 2px #232019}
.on,.primary{background:#2F6F4E!important;color:#FFFFFF!important}
main{max-width:1400px;margin:0 auto;padding:22px 14px;color:#232019;background:transparent;flex:1 1 auto;width:100%}
main *{-webkit-text-fill-color:currentColor}
.view{display:none}.view.on{display:block;background:transparent}
.card{background:#FFFFFF;border:1px solid #E5DFD0;border-radius:12px;padding:14px;margin:0 0 12px;color:#232019;box-shadow:0 1px 2px rgba(35,32,25,.04)}
.card h2,.card h3,.card h4,.card p,.card li,.card label{color:#232019}
.card .muted{color:#6E6656}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 12px;background:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px;background:transparent}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px;background:transparent}
.stat{background:#FFFFFF;border:1px solid #E5DFD0;padding:14px;border-radius:10px;color:#232019;margin:0}
.stat b{display:block;font-size:24px;color:#2F6F4E;font-family:Georgia,serif}
label{display:block;font-size:12px;font-weight:600;color:#6E6656;margin:7px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid #DAD3C3;border-radius:7px;background:#FFFFFF;color:#232019;font-family:inherit}
input::placeholder,textarea::placeholder{color:#8A8270}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0;background:transparent}
.muted{font-size:12px;color:#6E6656}
.success{color:#1E4D3B}.danger{color:#7F1D1D}
.tablewrap{overflow:auto;border:1px solid #E5DFD0;border-radius:8px}
table{border-collapse:collapse;width:100%;color:#232019}
th,td{border:1px solid #E5DFD0;padding:7px;text-align:center;font-size:12px;vertical-align:middle;color:#232019}
th{background:#F8F5EE;color:#232019}
.remove{background:#F8E4E1;color:#7F1D1D;padding:8px 10px!important;min-width:38px!important;line-height:1;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer}
.add{background:#E4EFE6;color:#1E4D3B}
.notice{background:#FBF0D9;border:1px solid #B4791F;padding:9px;border-radius:8px;font-size:12px;color:#7A5515;margin:0 0 12px}
.danger-zone{border:2px solid #B23A32!important;background:#FBEEEC!important}
.danger-zone h3{color:#7F1D1D!important}
.btn-danger{background:#B23A32!important;color:#fff!important;padding:11px 16px!important}
.success-zone{border:2px solid #2F6F4E!important;background:#E4EFE6!important}
.success-zone h3{color:#1E4D3B!important}
.info-zone{border:2px solid #2E5A8A!important;background:#E8F0F7!important}
.info-zone h3{color:#1E4D6B!important}
.section-info{background:#F8F5EE;border:1px solid #E5DFD0;border-left:4px solid #2F6F4E;border-radius:10px;padding:11px 14px;margin:0 0 12px;font-size:12.5px;color:#232019;line-height:1.55}
.section-info b{color:#232019}
.section-info code{background:#EFEBE2;padding:1px 5px;border-radius:4px;font-size:11.5px;color:#232019;font-weight:700}
.help-btn{background:#EFEBE2!important;color:#232019!important;padding:7px 12px!important;font-size:12px!important;border-radius:8px!important;border:1px solid #DAD3C3!important;cursor:pointer}
.help-btn:hover{background:#E5DFD0!important}
.header-flex{display:flex;justify-content:space-between;align-items:center;gap:12px}
.header-text{min-width:0}
.header-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}

/* ==== Students ==== */
.student-card{background:#FFFFFF;border:1px solid #E5DFD0;border-radius:12px;padding:12px;margin-bottom:10px}
.student-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #E5DFD0}
.student-roll{font-weight:800;font-size:13px;color:#232019;background:#EFEBE2;padding:4px 10px;border-radius:999px}
.student-actions{display:flex;gap:6px}
.student-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #F8F5EE}
.student-row:last-child{border-bottom:0}
.student-row label{flex:0 0 120px;font-size:11.5px;font-weight:800;color:#6E6656;text-transform:uppercase;letter-spacing:.05em;margin:0;line-height:1.2}
.student-row input{flex:1;min-width:0;padding:8px 10px;font-size:14px;border-radius:8px;background:#FFFFFF}
.empty-state{text-align:center;padding:36px 20px;color:#6E6656;background:#F8F5EE;border:1px dashed #DAD3C3;border-radius:12px}
.empty-state .icon{font-size:40px;display:block;margin-bottom:8px}
.action-footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.action-footer button{flex:1;min-width:140px;padding:12px 14px;font-size:14px}
.logo-preview{background:#F8F5EE;border:1px dashed #DAD3C3;border-radius:8px;padding:10px;text-align:center;min-height:100px;display:flex;align-items:center;justify-content:center;margin-top:8px}
.logo-preview img{max-height:80px;max-width:160px}

/* ==== Menu ==== */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.menu-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#FFFFFF;border:1px solid #E5DFD0;border-radius:12px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;transition:transform .12s,box-shadow .12s;color:#232019;width:100%}
.menu-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(35,32,25,.18)}
.menu-card-icon{font-size:26px;line-height:1}
.menu-card-title{font-weight:800;font-size:15px;color:#232019;font-family:Georgia,serif}
.menu-card-sub{font-size:12px;color:#6E6656;line-height:1.4}

/* ==== Heatmap ==== */
.hm-wrap{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px}
.hm-cell{width:14px;height:14px;border-radius:3px;background:#EFEBE2;flex:0 0 auto}
.hm-cell.hm-taken{background:#2F6F4E}
.hm-cell.hm-missing{background:#B23A32}
.hm-cell.hm-today-missing{background:#B4791F}
.hm-cell.hm-holiday{background:#2E5A8A}
.hm-cell.hm-future{background:#F8F5EE;border:1px dashed #DAD3C3;box-sizing:border-box}
.hm-cell.hm-weekend{opacity:.55}
.hm-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#6E6656;margin-top:10px}
.hm-dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:3px}
.hm-dot.hm-taken{background:#2F6F4E}
.hm-dot.hm-missing{background:#B23A32}
.hm-dot.hm-today-missing{background:#B4791F}
.hm-dot.hm-holiday{background:#2E5A8A}
.hm-dot.hm-future{background:#F8F5EE;border:1px dashed #DAD3C3;box-sizing:border-box}

/* ==== View sheet ==== */
.view-sheet{background:#FFFFFF;border:1px solid #E5DFD0;border-radius:12px;padding:18px;color:#232019}
.view-sheet-header{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:2px solid #232019;margin-bottom:14px}
.view-sheet-header .logo-slot{flex:0 0 60px;max-width:60px;display:flex;align-items:center;justify-content:center}
.view-sheet-header .logo-slot img{max-height:60px;max-width:60px;display:block}
.view-sheet-header .logo-slot.spacer{visibility:hidden}
.view-sheet-header .text-block{flex:1;text-align:center;min-width:0}
.view-sheet-header h2{margin:0;font-size:20px;color:#232019;font-weight:700;font-family:Georgia,serif}
.view-sheet-header .sub{font-size:13px;color:#6E6656;margin-top:4px;font-weight:700}
.view-sheet-header .sub2{font-size:12px;color:#8A8270;margin-top:2px}
.view-sheet-header .sheet-title{font-size:14px;color:#2F6F4E;font-weight:800;margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.view-sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
.view-sheet th,.view-sheet td{border:1px solid #E5DFD0;padding:7px 6px;text-align:center;font-size:12px;color:#232019;word-break:break-word}
.view-sheet th{background:#F8F5EE;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.view-sheet td.left{text-align:left}
.view-sheet tr:nth-child(even) td{background:#FAF8F4}

/* ==== Attendance ==== */
.att-datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.att-datebar .att-date-label{flex:1;min-width:200px;text-align:center;font-weight:800;font-size:14px;color:#232019;padding:0 8px}
.att-datebar button{min-width:44px;padding:9px 12px}
.att-datebar input[type="date"]{width:auto;flex:0 0 auto;padding:8px 10px}
.att-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.att-summary .stat b{font-size:24px}
.att-summary .stat.present b{color:#2F6F4E}
.att-summary .stat.absent b{color:#B23A32}
.att-summary .stat.leave b{color:#B4791F}
.att-summary .stat.holiday b{color:#2E5A8A}
.att-btn{min-width:42px;height:38px;border-radius:8px;font-size:15px;padding:0 8px;background:#EFEBE2;color:#8A8270;border:2px solid transparent;cursor:pointer;font-weight:800;line-height:1;transition:transform .12s,background .12s,color .12s,border-color .12s}
.att-btn:hover:not(:disabled){transform:translateY(-1px)}
.att-btn:disabled{opacity:.5;cursor:not-allowed}
.att-btn.active-p{background:#E4EFE6;color:#1E4D3B;border-color:#2F6F4E}
.att-btn.active-a{background:#F8E4E1;color:#7F1D1D;border-color:#B23A32}
.att-btn.active-l{background:#FBF0D9;color:#7A5515;border-color:#B4791F}
.att-cell{flex:0 0 auto;display:flex;gap:4px}
.att-student-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F8F5EE}
.att-student-row:last-child{border-bottom:0}
.att-student-info{flex:1;min-width:170px}
.att-student-roll{font-weight:800;font-size:11px;color:#6E6656;background:#EFEBE2;padding:2px 8px;border-radius:999px;display:inline-block;margin-right:6px}
.att-student-name{font-weight:700;font-size:14px;color:#232019;word-break:break-word;cursor:pointer;border-bottom:1px dotted transparent;transition:border-color .12s}
.att-student-name:hover{border-bottom-color:#8A8270}
.att-student-father{font-size:11.5px;color:#8A8270;margin-top:2px}
.att-absent-box{background:#F8E4E1;border:1px solid #B23A32;border-radius:8px;padding:10px 12px;color:#7F1D1D;font-size:13px;line-height:1.55}
.att-absent-box b{color:#7F1D1D}
.att-leave-box{background:#FBF0D9;border:1px solid #B4791F;border-radius:8px;padding:10px 12px;color:#7A5515;font-size:13px;line-height:1.55;margin-top:8px}
.att-leave-box b{color:#7A5515}
.att-holiday-box{background:#E8F0F7;border:1px solid #2E5A8A;border-radius:8px;padding:10px 12px;color:#1E4D6B;font-size:13px;line-height:1.55}
.att-ok-box{background:#E4EFE6;border:1px solid #2F6F4E;border-radius:8px;padding:10px 12px;color:#1E4D3B;font-size:13px}
.att-chip{display:inline-block;background:#FBF0D9;color:#7A5515;border:1px solid #B4791F;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;margin-left:6px}
.att-day-toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.att-day-toggles button{padding:8px 12px;font-size:12.5px;font-weight:800;border:2px solid transparent}
.att-day-toggles button.toggled-on{background:#232019;color:#fff;border-color:#232019}
.att-reg-wrap{overflow:auto;border:1px solid #E5DFD0;border-radius:8px;max-height:70vh;margin-top:10px}
.att-reg{width:100%;border-collapse:collapse;font-size:11px}
.att-reg th,.att-reg td{border:1px solid #E5DFD0;padding:3px 4px;text-align:center;white-space:nowrap;color:#232019;font-size:11px}
.att-reg th{background:#F8F5EE;font-weight:800;font-size:10.5px;position:sticky;top:0;z-index:1}
.att-reg th.weekend{background:#EFEBE2}
.att-reg td.p{color:#1E4D3B}
.att-reg td.a{color:#7F1D1D;background:#F8E4E1;font-weight:700}
.att-reg td.l{color:#7A5515;background:#FBF0D9;font-weight:700}
.att-reg td.h{color:#1E4D6B;background:#E8F0F7}
.att-reg td.empty{color:#DAD3C3}
.att-reg tr:nth-child(even) td{background:#FAF8F4}
.att-reg tr:nth-child(even) td.a{background:#F8E4E1}
.att-reg tr:nth-child(even) td.l{background:#FBF0D9}
.att-reg tr:nth-child(even) td.h{background:#E8F0F7}
.att-reg td.total-col,.att-reg th.total-col{background:#F8F5EE;border-left:2px solid #DAD3C3}

/* ==== Results / Assessments ==== */
.asmt-list-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.asmt-card{background:#FFFFFF;border:1px solid #E5DFD0;border-radius:12px;padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.asmt-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(35,32,25,.18)}
.asmt-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.asmt-card-name{font-weight:700;font-size:15px;color:#232019;word-break:break-word;font-family:Georgia,serif}
.asmt-card-sub{font-size:12px;color:#6E6656;font-weight:700;white-space:nowrap}
.asmt-bar{height:8px;background:#EFEBE2;border-radius:4px;overflow:hidden;margin:10px 0}
.asmt-bar .fill{height:100%;background:#2F6F4E;transition:width .3s}
.asmt-bar .fill.partial{background:#B4791F}
.asmt-stats{display:flex;justify-content:space-between;font-size:12px;color:#6E6656;gap:6px;flex-wrap:wrap}
.asmt-stats b{color:#232019}
.nf-form{background:#F8F5EE;border:1px solid #E5DFD0;border-radius:12px;padding:14px;margin-bottom:12px}
.subj-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.subj-chip{display:inline-flex;align-items:center;gap:3px;background:#F8F5EE;border:1px solid #E5DFD0;border-radius:999px;padding:4px 6px 4px 10px;font-size:12px;font-weight:700;color:#232019;flex:0 0 auto;width:auto;max-width:calc(50% - 3px)}
.subj-chip input{padding:4px 5px;font-size:12px;text-align:center;border:1px solid #E5DFD0;border-radius:6px;background:#FFFFFF;margin:0;box-sizing:border-box;min-width:0}
.subj-chip input.subjNameInp{width:auto !important;flex:1 1 auto;min-width:0;text-align:left;font-weight:700}
.subj-chip input:not(.subjNameInp){width:30px !important;flex:0 0 auto}
.subj-chip .rmSubj{background:#F8E4E1;color:#7F1D1D;border:0;border-radius:50%;width:18px;height:18px;padding:0;font-size:10px;font-weight:800;cursor:pointer;line-height:1;flex:0 0 auto}
.subj-add-row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.subj-add-row input{padding:8px 10px;font-size:13px}
.subj-add-row .inp-name{flex:1;min-width:140px}
.subj-add-row .inp-max{width:90px}
.copy-picker{background:#F8F5EE;border:1px solid #E5DFD0;border-radius:8px;padding:10px;margin-top:8px}
.res-wrap{overflow:auto;border:1px solid #E5DFD0;border-radius:8px;max-height:75vh}
.res-wrap table{border-collapse:separate;border-spacing:0;width:auto}
.res-wrap th,.res-wrap td{border:0;border-right:1px solid #E5DFD0;border-bottom:1px solid #E5DFD0;padding:3px 4px;text-align:center;font-size:12px;white-space:nowrap;color:#232019;background:#FFFFFF;vertical-align:middle}
.res-wrap thead th{background:#F8F5EE;font-weight:800;font-size:11px;position:sticky;top:0;z-index:2}
.res-wrap tfoot td{background:#F8F5EE;font-weight:700;color:#232019;font-size:11px;position:sticky;bottom:0;z-index:2;border-top:1.5px solid #DAD3C3}
.res-wrap th:first-child,.res-wrap td:first-child{border-left:1px solid #E5DFD0}
.res-wrap tbody tr.fail td{background:#FDF6F5}
.res-wrap tbody tr.fail td.fail-pct{background:#F8E4E1}
.res-wrap tr:nth-child(even) td{background:#FAF8F4}
.res-wrap tr:nth-child(even).fail td{background:#FDF6F5}
.res-wrap tr:nth-child(even).fail td.fail-pct{background:#F8E4E1}
.res-wrap th.sc1,.res-wrap td.sc1{position:sticky;left:0;z-index:3;background:#FFFFFF;width:44px!important;min-width:44px!important;max-width:44px!important}
.res-wrap th.sc2,.res-wrap td.sc2{position:sticky;left:44px;z-index:3;background:#FFFFFF;width:130px!important;min-width:130px!important;max-width:130px!important;box-shadow:4px 0 6px -4px rgba(35,32,25,.15)}
.res-wrap thead th.sc1,.res-wrap thead th.sc2{background:#F8F5EE;z-index:4}
.res-wrap tbody tr:nth-child(even) td.sc1,.res-wrap tbody tr:nth-child(even) td.sc2{background:#FAF8F4}
.res-wrap tbody tr.fail td.sc1,.res-wrap tbody tr.fail td.sc2{background:#FDF6F5}
.res-wrap tbody tr:nth-child(even).fail td.sc1,.res-wrap tbody tr:nth-child(even).fail td.sc2{background:#FDF6F5}
.res-wrap tfoot td.sc1,.res-wrap tfoot td.sc2{background:#F8F5EE;z-index:3}
.res-wrap td.marks-cell{padding:0;width:68px!important;min-width:68px}
.res-wrap td.marks-cell .marks-wrap{display:flex;align-items:center;gap:3px;padding:2px 4px;justify-content:center}
.res-wrap td.marks-cell input{flex:0 0 auto;width:40px;padding:6px 2px;border:0;background:transparent;text-align:center;font-size:13px;font-family:inherit;color:#232019;font-weight:700;box-sizing:border-box}
.res-wrap td.marks-cell input:focus{outline:2px solid #2E5A8A;outline-offset:-2px;background:#FFFFFF}
.res-wrap td.marks-cell input.empty{color:#DAD3C3;font-weight:500}
.res-wrap td.marks-cell input.absent{color:#7F1D1D;font-weight:800}
.res-wrap td.marks-cell input.overmax{outline:2px solid #B4791F;outline-offset:-2px}
.res-wrap td.marks-cell.below33{box-shadow:inset 3px 0 0 #B4791F}
.a-btn{flex:0 0 auto;width:18px;height:18px;padding:0;font-size:9.5px;font-weight:800;border-radius:4px;background:#F8F5EE;color:#8A8270;border:1px solid #E5DFD0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.a-btn:hover{background:#EFEBE2}
.a-btn.on{background:#F8E4E1;color:#7F1D1D;border-color:#B23A32}

/* ==== Funds ==== */
.fund-list-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fund-card{background:#FFFFFF;border:1px solid #E5DFD0;border-radius:12px;padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}

.fund-wrap td.famt-cell input{flex:0 0 auto;width:62px;padding:6px 3px;border:0;background:transparent;text-align:center;font-size:13px;font-family:inherit;color:#232019;font-weight:700;box-sizing:border-box}

.fund-wrap td.famt-cell.at-target{background:#E4EFE6}
.fund-wrap td.famt-cell.exempt-cell{background:#F8F5EE}
.e-btn{flex:0 0 auto;width:20px;height:20px;padding:0;font-size:10px;font-weight:800;border-radius:4px;background:#F8F5EE;color:#8A8270;border:1px solid #E5DFD0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

.fund-wrap td.fdate-cell input{width:120px;padding:6px 4px;border:0;background:transparent;font-size:11.5px;font-family:inherit;color:#232019;text-align:center}

/* ==== Modals / Sheets ==== */
.picker-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(35,32,25,.55);z-index:9999;display:flex;align-items:flex-end;animation:pkFade .15s ease}
.picker-sheet{background:#FFFFFF;color:#232019;width:100%;max-height:85vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:pkSlide .2s ease;overflow:hidden}
.picker-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #E5DFD0;flex:0 0 auto}
.picker-head h3{margin:0;font-size:16px;color:#232019}
.picker-close{background:transparent;border:0;font-size:20px;padding:4px 10px;cursor:pointer;color:#6E6656}
.picker-search{padding:10px 14px;border-bottom:1px solid #E5DFD0;flex:0 0 auto}
.picker-search input{width:100%;padding:12px 13px;font-size:16px;color:#232019;border:1px solid #DAD3C3;border-radius:9px;background:#F8F5EE;appearance:none;-webkit-appearance:none}
.picker-search input::-webkit-search-cancel-button{display:none}
.picker-list{overflow:auto;padding:6px 0;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.picker-item{display:block;width:100%;text-align:left;padding:14px 20px;background:transparent;border:0;font-size:15px;font-weight:600;color:#232019;border-bottom:1px solid #F8F5EE;cursor:pointer}
.picker-item:last-child{border-bottom:0}
.picker-item.selected{background:#2F6F4E;color:#FFFFFF}
.picker-empty{padding:26px;text-align:center;color:#6E6656;font-size:14px}
@keyframes pkFade{from{opacity:0}to{opacity:1}}@keyframes pkSlide{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(min-width:801px){.picker-overlay{align-items:center;justify-content:center}.picker-sheet{max-width:480px;border-radius:16px;max-height:70vh}}

.toast-container{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{background:#232019;color:#F6F4EF;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 20px -8px rgba(35,32,25,.4);opacity:0;transform:translateY(12px);transition:opacity .22s,transform .22s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#2F6F4E;color:#FFFFFF}
.toast.error{background:#B23A32;color:#FFFFFF}
.toast.info{background:#B4791F;color:#FFFFFF}
@media(min-width:801px){.toast-container{left:auto;right:20px;bottom:20px;transform:none;align-items:flex-end}.toast{max-width:340px;text-align:left}}

.confirm-overlay{position:fixed;inset:0;background:rgba(35,32,25,.55);z-index:10000;display:none;align-items:flex-end}
.confirm-overlay.show{display:flex}
.confirm-sheet{background:#FFFFFF;color:#232019;width:100%;border-radius:16px 16px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:pkSlide .2s ease}
.confirm-icon{font-size:32px;text-align:center;margin:0 0 8px;line-height:1}
.confirm-title{margin:0 0 8px;font-size:16px;font-weight:800;color:#232019;text-align:center}
.confirm-msg{margin:0 0 18px;font-size:14px;line-height:1.45;color:#6E6656;text-align:center;white-space:pre-line}
.confirm-actions{display:flex;gap:10px}
.confirm-actions button{flex:1;padding:14px 12px;font-size:15px;font-weight:800;border-radius:10px}
.confirm-no{background:#EFEBE2!important;color:#232019!important}
.confirm-yes{background:#2F6F4E!important;color:#FFFFFF!important}
.confirm-overlay.danger .confirm-yes{background:#B23A32!important;color:#fff!important}
@media(min-width:801px){.confirm-overlay{align-items:center;justify-content:center}.confirm-sheet{max-width:400px;border-radius:16px}}

.help-modal{position:fixed;inset:0;background:#F6F4EF;color:#232019;z-index:9997;display:none;flex-direction:column}
.help-modal.show{display:flex}
.help-modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#FFFFFF;color:#232019;border-bottom:1px solid #E5DFD0}
.help-modal-title{font-weight:800;font-size:15px;color:#232019}
.help-modal-close{background:transparent;border:0;font-size:22px;color:#232019;padding:4px 10px;cursor:pointer}
.help-modal-body{flex:1;overflow:auto;padding:14px;color:#232019;-webkit-overflow-scrolling:touch}
.help-content{max-width:820px;margin:0 auto;padding:6px 4px 40px}
.help-content h2{font-size:17px;color:#232019;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid #E5DFD0}
.help-content h3{font-size:14px;color:#2F6F4E;margin:14px 0 6px}
.help-content p,.help-content li{font-size:13.5px;line-height:1.65;color:#232019}
.help-content ol,.help-content ul{padding-left:22px;margin:6px 0}
.help-content li{margin-bottom:4px}
.help-content .help-step{background:#F8F5EE;border-left:4px solid #2F6F4E;padding:11px 14px;margin:8px 0;border-radius:8px;font-size:13.5px;line-height:1.6;color:#232019}
.help-content .help-step b{color:#2F6F4E}
.help-content .tip-box{background:#FBF0D9;border:1px solid #B4791F;padding:10px 14px;border-radius:8px;font-size:13px;color:#7A5515;margin:10px 0;line-height:1.55}
.help-content .tip-box b{color:#6B4410}

.undo-redo-container{position:fixed;bottom:130px;right:12px;z-index:55;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.undo-redo-btn{width:40px;height:40px;border-radius:50%;background:rgba(47,111,78,.9);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px -3px rgba(47,111,78,.4);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:transform .15s,opacity .15s,background .15s;pointer-events:auto;padding:0;line-height:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.undo-redo-btn:hover:not(:disabled){transform:scale(1.06);background:rgba(47,111,78,1)}
.undo-redo-btn:active:not(:disabled){transform:scale(.96)}
.undo-redo-btn:disabled{opacity:.3;cursor:default;box-shadow:0 1px 4px -1px rgba(35,32,25,.2)}

function ordinal(n){
  n = Number(n);
  if (!n || n <= 0 || !isFinite(n)) return "—";
  if (n === 1) return "1st";
  if (n === 2) return "2nd";
  if (n === 3) return "3rd";
  return "";
}

/* ================ UNDO / REDO ================ */
let historyStack = [];
let redoStack = [];
const MAX_HISTORY = 30;
let isRestoring = false;
let lastSavedState = JSON.stringify(data);

function save(){
  const _s = JSON.stringify(data);
  try { localStorage.setItem("classroomData", _s); } catch(e) { toast("Storage full — export a backup and remove the logo.", "error"); return; }
  localStorage.setItem("classroomLastSaved", String(Date.now()));
  if (isRestoring) { lastSavedState = _s; updateAttendanceBadges(); return; }
  if (_s !== lastSavedState) {
    historyStack.push(lastSavedState);
    if (historyStack.length > MAX_HISTORY) historyStack.shift();
    redoStack = [];
    lastSavedState = _s;
    updateUndoRedoButtons();
  }
  updateAttendanceBadges();
}
function quickSave(){
  localStorage.setItem("classroomData", JSON.stringify(data));
  localStorage.setItem("classroomLastSaved", String(Date.now()));
}
function updateUndoRedoButtons(){
  const u = document.getElementById("undoBtn");
  const r = document.getElementById("redoBtn");
  if (u) u.disabled = historyStack.length === 0;
  if (r) r.disabled = redoStack.length === 0;
}
function undo(){
  if (historyStack.length === 0) { toast("Nothing to undo", "info"); return; }
  isRestoring = true;
  redoStack.push(lastSavedState);
  const prev = historyStack.pop();
  data = JSON.parse(prev);
  lastSavedState = prev;
  save();
  isRestoring = false;
  const activeView = document.querySelector(".view.on");
  const tab = activeView ? activeView.id : "dashboard";
  render(tab);
  updateUndoRedoButtons();
  toast("Undone", "info");
}
function redo(){
  if (redoStack.length === 0) { toast("Nothing to redo", "info"); return; }
  isRestoring = true;
  historyStack.push(lastSavedState);
  if (historyStack.length > MAX_HISTORY) historyStack.shift();
  const next = redoStack.pop();
  data = JSON.parse(next);
  lastSavedState = next;
  save();
  isRestoring = false;
  const activeView = document.querySelector(".view.on");
  const tab = activeView ? activeView.id : "dashboard";
  render(tab);
  updateUndoRedoButtons();
  toast("Redone", "info");
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeHelp(); closeInfoModal(); return; }
  const ctrl = e.ctrlKey || e.metaKey;
  if (!ctrl) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
});

/* ================ HELPERS ================ */
function esc(s){return String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function toast(msg, type){const c=document.getElementById("toastContainer");const t=document.createElement("div");t.className="toast "+(type||"success");t.textContent=String(msg||"");c.appendChild(t);requestAnimationFrame(()=>t.classList.add("show"));setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),300)},2400)}
window.alert = function(msg){toast(msg,"info")};
function uiConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve => {
    const modal = document.getElementById("confirmModal");
    const msg = modal.querySelector(".confirm-msg");
    const title = modal.querySelector(".confirm-title");
    const icon = modal.querySelector(".confirm-icon");
    const yes = modal.querySelector(".confirm-yes");
    const no = modal.querySelector(".confirm-no");
    msg.textContent = String(message || "");
    title.textContent = opts.title || "Confirm";
    icon.textContent = opts.icon || "⚠️";
    yes.textContent = opts.yesText || "Confirm";
    no.textContent = opts.noText || "Cancel";
    modal.classList.toggle("danger", !!opts.danger);
    const cleanup = result => {
      modal.classList.remove("show");
      yes.removeEventListener("click", yH);
      no.removeEventListener("click", nH);
      modal.removeEventListener("click", bg);
      resolve(result);
    };
    const yH = () => cleanup(true);
    const nH = () => cleanup(false);
    const bg = e => { if (e.target === modal) cleanup(false); };
    yes.addEventListener("click", yH);
    no.addEventListener("click", nH);
    modal.addEventListener("click", bg);
    modal.classList.add("show");
  });
}
function uiPrompt(message, defaultValue, opts){
  opts = opts || {};
  return new Promise(resolve => {
    const modal = document.getElementById("confirmModal");
    const msg = modal.querySelector(".confirm-msg");
    const title = modal.querySelector(".confirm-title");
    const icon = modal.querySelector(".confirm-icon");
    const yes = modal.querySelector(".confirm-yes");
    const no = modal.querySelector(".confirm-no");
    title.textContent = opts.title || "Input";
    icon.textContent = opts.icon || "✎";
    yes.textContent = opts.yesText || "OK";
    no.textContent = opts.noText || "Cancel";
    modal.classList.remove("danger");
    msg.textContent = message || "";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = defaultValue || "";
    inp.style.cssText = "width:100%;margin-top:10px;padding:11px;font-size:15px;border:1px solid #DAD3C3;border-radius:8px;background:#FFFFFF;color:#232019;box-sizing:border-box;font-family:inherit";
    msg.appendChild(inp);
    const cleanup = result => {
      modal.classList.remove("show");
      yes.removeEventListener("click", yH);
      no.removeEventListener("click", nH);
      modal.removeEventListener("click", bg);
      inp.removeEventListener("keydown", kH);
      resolve(result);
    };
    const yH = () => cleanup(inp.value);
    const nH = () => cleanup(null);
    const bg = e => { if (e.target === modal) cleanup(null); };
    const kH = e => { if (e.key === "Enter") { e.preventDefault(); cleanup(inp.value); } };
    yes.addEventListener("click", yH);
    no.addEventListener("click", nH);
    modal.addEventListener("click", bg);
    inp.addEventListener("keydown", kH);
    modal.classList.add("show");
    requestAnimationFrame(() => { inp.focus(); inp.select(); });
  });
}
function timeAgo(ms){
  const diff = Date.now() - ms;
  if (diff < 0) return "just now";
  const s = Math.floor(diff/1000);
  if (s < 10) return "just now";
  if (s < 60) return s + " seconds ago";
  const m = Math.floor(s/60);
  if (m < 60) return m + (m===1 ? " minute ago" : " minutes ago");
  const h = Math.floor(m/60);
  if (h < 24) return h + (h===1 ? " hour ago" : " hours ago");
  const d = Math.floor(h/24);
  if (d < 30) return d + (d===1 ? " day ago" : " days ago");
  return new Date(ms).toLocaleDateString();
}

/* ================ DATE HELPERS ================ */
function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayKey(){ return dateKey(new Date()); }
function parseKey(key){
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y, m-1, d);
}
function getMonthDays(year, month){
  const n = new Date(year, month+1, 0).getDate();
  const out = [];
  for (let d=1; d<=n; d++){
    out.push(`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  }
  return out;
}
function prettyDate(key){
  return parseKey(key).toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"long", year:"numeric" });
}
function prettyMonth(monthKey){
  const [y,m] = monthKey.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" });
}
function prettyShortDate(key){
  if (!key) return "—";
  try { return parseKey(key).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" }); }
  catch(e){ return key; }
}

/* ================ ATTENDANCE DATA ================ */
function ensureDay(key){
  if (!data.attendance[key]) {
    data.attendance[key] = { holiday: false, locked: false, status: {} };
  }
  const d = data.attendance[key];
  if (!d.status || typeof d.status !== "object") d.status = {};
  if (typeof d.holiday !== "boolean") d.holiday = false;
  if (typeof d.locked !== "boolean") d.locked = false;
  return d;
}
function getStatus(key, sid){
  const day = data.attendance[key];
  if (!day) return "P";
  if (day.holiday) return "H";
  return day.status[sid] || "P";
}
function countDay(key){
  const total = data.students.length;
  const day = data.attendance[key];
  if (!day) return { total, present: total, absent: 0, leave: 0, holiday:false, taken:false, locked:false };
  if (day.holiday) return { total, present: 0, absent: 0, leave: 0, holiday:true, taken:true, locked: !!day.locked };
  let absent = 0, leave = 0;
  data.students.forEach(s => {
    const st = day.status[s.id] || "P";
    if (st === "A") absent++;
    else if (st === "L") leave++;
  });
  return { total, present: total - absent - leave, absent, leave, holiday:false, taken:true, locked: !!day.locked };
}
function studentMonthStats(s, monthKey){
  const [y, m] = monthKey.split("-").map(Number);
  const days = getMonthDays(y, m-1);
  const today = todayKey();
  const joinKey = s.createdAt ? dateKey(new Date(s.createdAt)) : null;
  let p=0, a=0, l=0, h=0;
  days.forEach(k => {
    if (k > today) return;
    if (joinKey && k < joinKey) return;
    const day = data.attendance[k];
    if (!day) return;
    if (day.holiday) { h++; return; }
    const st = day.status[s.id] || "P";
    if (st === "P") p++;
    else if (st === "A") a++;
    else if (st === "L") l++;
  });
  const denom = p + a;
  const pct = denom ? Math.round((p / denom) * 100) : 0;
  return { p, a, l, h, pct };
}

function isTodayAttendanceTaken(){
  if (!data.students.length) return true;
  const key = todayKey();
  return !!data.attendance[key];
}
function updateAttendanceBadges(){
  const show = !isTodayAttendanceTaken();

  const botBtn = document.querySelector('.bottom-nav button[data-id="attendance"]');
  if (botBtn) botBtn.classList.toggle("nav-badge", show);

function attendanceHeatmapHTML(){
  if (!data.students.length) return "";
  const today = new Date();
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  const todayK = todayKey();
  const cells = days.map(d => {
    const k = dateKey(d);
    const day = data.attendance[k];
    let cls = "hm-future";
    if (k > todayK) cls = "hm-future";
    else if (day && day.holiday) cls = "hm-holiday";
    else if (day) cls = "hm-taken";
    else if (k === todayK) cls = "hm-today-missing";
    else cls = "hm-missing";
    const wd = d.getDay();
    const isWeekend = (wd === 0 || wd === 6);
    return `<div class="hm-cell ${cls}${isWeekend?' hm-weekend':''}" title="${esc(k)}"></div>`;
  }).join("");
  return `<div class="hm-wrap">${cells}</div>
    <div class="hm-legend">
      <span><span class="hm-dot hm-taken"></span> Taken</span>
      <span><span class="hm-dot hm-missing"></span> Not taken</span>
      <span><span class="hm-dot hm-today-missing"></span> Today (not yet)</span>
      <span><span class="hm-dot hm-holiday"></span> Holiday</span>
      <span><span class="hm-dot hm-future"></span> Future</span>
    </div>`;
}

/* ================ ATTENDANCE — BULK HOLIDAY ================ */
function openBulkHoliday(){
  const html = `
    <div class="help-content">
      <h2>Mark Date Range as Holiday</h2>
      <p>Every date in this range will be marked as a <b>Class Holiday</b> — not counted in any student's attendance percentage. Useful for Eid break, summer, or unexpected closures.</p>
      <label>Start date</label>
      <input type="date" id="bhStart" value="${esc(attDate)}">
      <label>End date</label>
      <input type="date" id="bhEnd" value="${esc(attDate)}">
      <div class="actions" style="margin-top:14px">
        <button class="primary" onclick="applyBulkHoliday()">✓ Mark as Holiday</button>
        <button onclick="closeInfoModal()">Cancel</button>
      </div>
      <div class="tip-box" style="margin-top:16px">Tip: locked days inside the range will be skipped.</div>
    </div>`;
  showInfoModal("Bulk Holiday", html);
}
async function applyBulkHoliday(){
  const s = document.getElementById("bhStart")?.value;
  const e = document.getElementById("bhEnd")?.value;
  if (!s || !e) { toast("Please select both dates.", "error"); return; }
  if (s > e) { toast("Start date must be before end date.", "error"); return; }
  const start = parseKey(s);
  const end = parseKey(e);
  let count = 0, skipped = 0;
  const d = new Date(start);
  while (d <= end) {
    const k = dateKey(d);
    const day = ensureDay(k);
    if (day.locked) { skipped++; }
    else { day.holiday = true; count++; }
    d.setDate(d.getDate() + 1);
  }
  save();
  closeInfoModal();
  render("attendance");
  const msg = skipped > 0
    ? `${count} day${count===1?'':'s'} marked as Holiday. ${skipped} locked day${skipped===1?'':'s'} skipped.`
    : `${count} day${count===1?'':'s'} marked as Holiday.`;
  toast(msg, "success");
}

/* ================ ATTENDANCE — STUDENT SUMMARY ================ */
function openStudentSummary(sid){
  const s = data.students.find(x => x.id === sid);
  if (!s) return;
  let p=0, a=0, l=0;
  const months = {};
  Object.keys(data.attendance).forEach(k => {
    const day = data.attendance[k];
    if (!day) return;
    const mk = k.slice(0, 7);
    if (!months[mk]) months[mk] = { p:0, a:0, l:0, h:0 };
    if (day.holiday) { months[mk].h++; return; }
    const st = day.status[sid] || "P";
    if (st === "P") { p++; months[mk].p++; }
    else if (st === "A") { a++; months[mk].a++; }
    else if (st === "L") { l++; months[mk].l++; }
  });
  const denom = p + a;
  const pct = denom ? Math.round((p/denom)*100) : 0;
  const monthRows = Object.keys(months).sort().reverse().map(mk => {
    const m = months[mk];
    const d = m.p + m.a;
    const mpct = d ? Math.round((m.p/d)*100) : 0;
    return `<tr>
      <td style="text-align:left">${esc(prettyMonth(mk))}</td>
      <td>${m.p}</td>
      <td>${m.a}</td>
      <td>${m.l}</td>
      <td>${m.h}</td>
      <td><b>${d ? mpct+"%" : "—"}</b></td>
    </tr>`;
  }).join("");

  const html = `
    <div class="help-content">
      <h2>${esc(s.name || "(no name)")}${s.rollNo ? ` — Roll ${esc(s.rollNo)}` : ""}</h2>
      ${s.fatherName ? `<p>s/o ${esc(s.fatherName)}</p>` : ""}
      <div class="grid2" style="margin-top:10px">
        <div class="stat"><b>${p}</b>Total Present</div>
        <div class="stat"><b>${a}</b>Total Absent</div>
        <div class="stat"><b>${l}</b>Total Leave</div>
        <div class="stat"><b>${pct}%</b>Overall Attendance</div>
      </div>
      <h3 style="margin-top:20px">Monthly Breakdown</h3>
      ${monthRows ? `<div class="tablewrap"><table>
        <thead><tr><th style="text-align:left">Month</th><th>P</th><th>A</th><th>L</th><th>Holiday</th><th>%</th></tr></thead>
        <tbody>${monthRows}</tbody>
      </table></div>` : `<p class="muted">No records yet.</p>`}
      <div class="tip-box" style="margin-top:16px">% = Present / (Present + Absent). Leave and Holidays are excluded.</div>
    </div>`;
  showInfoModal("Student Attendance", html);
}

  const t = document.getElementById("infoModalTitle");
  const b = document.getElementById("infoModalBody");
  if (!m || !t || !b) return;
  const helpModal = document.getElementById("helpModal");

  t.textContent = title || "Info";
  b.innerHTML = bodyHTML || "";

  const m = document.getElementById("infoModal");
  if (!m) return;
  m.classList.remove("show");
  document.body.style.overflow = "";
}

/* ================ ASSESSMENTS DATA ================ */
function getAssessmentById(id){ return data.assessments.find(a => a.id === id); }
function assessmentMaxTotal(asmt){ return asmt.subjects.reduce((sum, s) => sum + (Number(s.max)||0), 0); }

function getAssessmentRawMark(asmtId, sid, subId){
  const r = data.assessmentResults[asmtId];
  if (!r) return undefined;
  const row = r[sid];
  if (!row) return undefined;
  const v = row[subId];
  if (v === undefined || v === null || v === "") return undefined;
  return v;
}
function getAssessmentNumericMark(asmtId, sid, subId){
  const v = getAssessmentRawMark(asmtId, sid, subId);
  if (v === undefined) return 0;
  if (v === "A" || v === "a") return 0;
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}
function setAssessmentRawMark(asmtId, sid, subId, value){
  if (!data.assessmentResults[asmtId]) data.assessmentResults[asmtId] = {};
  if (!data.assessmentResults[asmtId][sid]) data.assessmentResults[asmtId][sid] = {};
  if (value === undefined || value === null || value === "") {
    delete data.assessmentResults[asmtId][sid][subId];
    if (Object.keys(data.assessmentResults[asmtId][sid]).length === 0) delete data.assessmentResults[asmtId][sid];
  } else if (value === "A" || value === "a") {
    data.assessmentResults[asmtId][sid][subId] = "A";
  } else {
    const n = Number(value);
    if (!isNaN(n)) data.assessmentResults[asmtId][sid][subId] = n;
  }
}
function calcAssessmentResult(s, asmt){
  let total = 0;
  const subMarks = asmt.subjects.map(sub => {
    const m = getAssessmentNumericMark(asmt.id, s.id, sub.id);
    const mx = Number(sub.max) || 0;
    total += m;
    return { subId: sub.id, mark: m, max: mx, below33: mx > 0 && (m / mx) < 0.33 };
  });
  const maxTotal = assessmentMaxTotal(asmt);
  const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 1000) / 10 : 0;
  const passPct = Number(asmt.passPercent) || 40;
  const computedPass = maxTotal > 0 && pct >= passPct;
  const manual = !!((data.assessmentManualPass[asmt.id]||{})[s.id]);
  const passed = computedPass || manual;
  return { total, maxTotal, pct, computedPass, passed, manual, subMarks, anyBelow33: subMarks.some(x => x.below33) };
}
function computeAssessmentRanking(asmtId){
  const asmt = getAssessmentById(asmtId);
  if (!asmt) return [];
  const students = getSortedStudents();
  const arr = students.map(s => ({ s, r: calcAssessmentResult(s, asmt) }));
  const sorted = arr.slice().sort((a,b) => b.r.total - a.r.total);
  let lastTotal = null, lastRank = 0;
  sorted.forEach((item, i) => {
    if (item.r.total !== lastTotal) { lastRank = i + 1; lastTotal = item.r.total; }
    item.rank = (item.r.maxTotal > 0) ? lastRank : 0;
  });
  const rankMap = {};
  sorted.forEach(x => { rankMap[x.s.id] = x.rank; });
  return arr.map(x => ({ ...x, rank: rankMap[x.s.id] || 0 }));
}
function assessmentEntryCount(asmtId){
  const r = data.assessmentResults[asmtId] || {};
  let count = 0;
  data.students.forEach(s => {
    const row = r[s.id];
    if (!row) return;
    if (Object.keys(row).length > 0) count++;
  });
  return count;
}

/* ================ FUNDS DATA ================ */
function getFundById(id){ return data.funds.find(f => f.id === id); }
function getFundPayment(fundId, sid){
  const f = data.fundPayments[fundId];
  return f ? f[sid] : undefined;
}
function setFundPayment(fundId, sid, patch){
  if (!data.fundPayments[fundId]) data.fundPayments[fundId] = {};
  const cur = data.fundPayments[fundId][sid] || {};
  const next = { ...cur, ...patch };
  if ((next.amount === undefined || next.amount === 0 || next.amount === "" || next.amount === null) &&
      !next.note && !next.exempt && !next.date) {
    delete data.fundPayments[fundId][sid];
  } else {
    data.fundPayments[fundId][sid] = next;
  }
}
function isVariableFund(fund){
  return !fund || (Number(fund.amount) || 0) <= 0;
}
function getFundStudentStatus(fundId, sid){
  const fund = getFundById(fundId);
  if (!fund) return { code:"PENDING", amount:0, target:0, pct:0, variable:true };
  const variable = isVariableFund(fund);
  const p = getFundPayment(fundId, sid) || {};
  if (p.exempt) return { code:"EXEMPT", amount:0, target:fund.amount, pct:0, exempt:true, variable };
  const amount = Number(p.amount) || 0;
  const target = Number(fund.amount) || 0;
  if (variable) {
    if (amount > 0) return { code:"PAID", amount, target:0, pct:100, variable:true };
    return { code:"PENDING", amount:0, target:0, pct:0, variable:true };
  }
  if (amount >= target) return { code:"PAID", amount, target, pct:100, overpaid: amount > target, variable:false };
  if (amount > 0) return { code:"PARTIAL", amount, target, pct: Math.round((amount/target)*100), variable:false };
  return { code:"PENDING", amount:0, target, pct:0, variable:false };
}
function computeFundStats(fundId){
  const fund = getFundById(fundId);
  const target = fund ? (Number(fund.amount)||0) : 0;
  const variable = target <= 0;
  let collected = 0, pending = 0, paid = 0, partial = 0, pend = 0, exempt = 0, overpaidTotal = 0;
  const students = getSortedStudents();
  students.forEach(s => {
    const st = getFundStudentStatus(fundId, s.id);
    if (st.code === "EXEMPT") { exempt++; return; }
    collected += st.amount;
    if (st.code === "PAID") { paid++; if (st.overpaid) overpaidTotal += (st.amount - st.target); }
    else if (st.code === "PARTIAL") { partial++; pending += Math.max(0, st.target - st.amount); }
    else { pend++; if (!variable) pending += st.target; }
  });
  const totalStudentsCounted = students.length - exempt;
  const totalTarget = variable ? 0 : totalStudentsCounted * target;
  const pct = variable
    ? (totalStudentsCounted > 0 ? Math.round((paid / totalStudentsCounted) * 100) : 0)
    : (totalTarget > 0 ? Math.round((collected / totalTarget) * 100) : 0);
  return { collected, pending, paid, partial, pend, exempt, overpaidTotal, totalStudentsCounted, totalTarget, pct, totalStudents: students.length, variable };
}

function show(id, fromPop){
  syncPendingDOM();

  currentTab = id;

  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));

  nav.querySelectorAll("button").forEach(b => {

    b.classList.toggle("on", isOn);
  });
  bottomNav.querySelectorAll("button").forEach(b => {
    const isOn = b.dataset.id === id || (isMenuChild && b.dataset.id === "menu");
    b.classList.toggle("on", isOn);

      const sid = e.target.dataset.sid;
      const field = e.target.dataset.field;
      const s = data.students.find(x => x.id === sid);
      if (!s) return;
      s[field] = e.target.value;
      save();
    });
  });
}

function getFilteredStudents(){
  let list = data.students.slice();
  const q = studentSearch.trim().toLowerCase();
  if (q) {
    list = list.filter(s =>
      (s.name || "").toLowerCase().includes(q) ||
      (s.fatherName || "").toLowerCase().includes(q) ||
      (s.admissionNo || "").toLowerCase().includes(q) ||
      (s.rollNo || "").toLowerCase().includes(q) ||
      (s.phone || "").toLowerCase().includes(q)
    );
  }
  list.sort((a,b) => String(a.rollNo||"").localeCompare(String(b.rollNo||""), undefined, { numeric: true }));
  return list;
}

function newId(){ return "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }
function newFundId(){ return "fund_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }

function addStudent(){
  if (!data.className) {
    uiConfirm(
      "You haven't set the Class Name yet.\n\nWould you like to open Settings now?",
      { title: "Class Name Required", yesText: "Open Settings", icon: "⚙️" }
    ).then(ok => { if (ok) show("settings"); });
    return;
  }
  studentSearch = "";
  const searchEl = document.getElementById("studentSearch");
  if (searchEl) searchEl.value = "";
  let maxRoll = 0;
  data.students.forEach(s => {
    const n = parseInt(s.rollNo, 10);
    if (!isNaN(n) && n > maxRoll) maxRoll = n;
  });
  const nextRoll = String(maxRoll + 1).padStart(2, "0");
  const s = {
    id: newId(),
    admissionNo: "",
    rollNo: nextRoll,
    name: "",
    fatherName: "",
    phone: "",
    address: "",
    notes: "",
    createdAt: Date.now()
  };
  data.students.push(s);
  save();
  renderStudents();
  toast(`Student added (Roll ${nextRoll}).`, "success");
  requestAnimationFrame(() => {
    const el = document.querySelector(`#students input[data-sid="${s.id}"][data-field="name"]`);
    if (el) { el.focus(); el.scrollIntoView({block:"center", behavior:"smooth"}); }
  });
}

async function removeStudent(id){
  const s = data.students.find(x => x.id === id);
  if (!s) return;
  const label = s.name ? `"${s.name}"` : "this student";
  const ok = await uiConfirm(`Remove ${label}?\n\nAll records will be permanently deleted — attendance, assessment marks, remarks, and fund payments. This cannot be undone (except via Undo).`, { title: "Remove Student", yesText: "Remove", danger: true, icon: "🗑️" });
  if (!ok) return;
  Object.keys(data.attendance || {}).forEach(k => {
    const d = data.attendance[k];
    if (d && d.status && d.status[id] !== undefined) delete d.status[id];
  });
  Object.keys(data.assessmentResults || {}).forEach(asmtId => {
    if (data.assessmentResults[asmtId] && data.assessmentResults[asmtId][id] !== undefined) delete data.assessmentResults[asmtId][id];
  });
  Object.keys(data.assessmentManualPass || {}).forEach(asmtId => {
    if (data.assessmentManualPass[asmtId] && data.assessmentManualPass[asmtId][id] !== undefined) delete data.assessmentManualPass[asmtId][id];
  });
  Object.keys(data.assessmentRemarks || {}).forEach(asmtId => {
    if (data.assessmentRemarks[asmtId] && data.assessmentRemarks[asmtId][id] !== undefined) delete data.assessmentRemarks[asmtId][id];
  });
  Object.keys(data.fundPayments || {}).forEach(fundId => {
    if (data.fundPayments[fundId] && data.fundPayments[fundId][id] !== undefined) delete data.fundPayments[fundId][id];
  });
  data.students = data.students.filter(x => x.id !== id);
  save();
  renderStudents();
  toast("Student removed.", "success");
}

function saveStudents(){
  syncStudentsFromDOM();
  data.students.forEach(s => {
    s.admissionNo = (s.admissionNo||"").trim();
    s.rollNo = (s.rollNo||"").trim();
    s.name = (s.name||"").trim();
    s.fatherName = (s.fatherName||"").trim();
    s.phone = (s.phone||"").trim();
    s.address = (s.address||"").trim();
    s.notes = (s.notes||"").trim();
  });
  save();
  toast("Students saved.", "success");
  renderStudents();
}

/* ================ ATTENDANCE TAB ================ */
let attDate = todayKey();
let attRegisterMonth = todayKey().slice(0,7);
let attRegisterOpen = false;

function shiftDate(delta){
  const d = parseKey(attDate);
  d.setDate(d.getDate() + delta);
  const nk = dateKey(d);
  if (nk > todayKey()) { toast("Future dates are not allowed.", "info"); return; }
  attDate = nk;
  renderAttendance();
}
function setAttDate(k){
  if (!k) return;
  if (k > todayKey()) { toast("Future dates are not allowed.", "info"); return; }
  attDate = k;
  renderAttendance();
}
function goToday(){ attDate = todayKey(); renderAttendance(); }

function setStatus(sid, status){
  const day = ensureDay(attDate);
  if (day.locked) { toast("This day is locked. Unlock it first.", "error"); return; }
  if (day.holiday) { toast("Day is marked as Holiday.", "error"); return; }
  if (status === "P") delete day.status[sid];
  else day.status[sid] = status;
  save();
  renderAttendance();
}
function markAllPresent(){
  const day = ensureDay(attDate);
  if (day.locked) { toast("Day is locked.", "error"); return; }
  day.holiday = false;
  day.status = {};
  save();
  renderAttendance();
  toast("All students marked present.", "success");
}
async function resetDay(){
  if (!data.attendance[attDate]) { toast("Nothing to reset.", "info"); return; }
  const ok = await uiConfirm("Reset attendance for this day?\n\nThis clears all marks.", { title:"Reset Day", yesText:"Reset", danger:true, icon:"🔄" });
  if (!ok) return;
  delete data.attendance[attDate];
  save();
  renderAttendance();
  toast("Day reset.", "success");
}
function toggleHoliday(){
  const day = ensureDay(attDate);
  if (day.locked) { toast("Day is locked.", "error"); return; }
  day.holiday = !day.holiday;
  save();
  renderAttendance();
  toast(day.holiday ? "Marked as Holiday." : "Holiday removed.", "info");
}
function toggleLock(){ if (!data.attendance[attDate]) { toast("Take attendance first, then lock this day.", "info"); return; }
  const day = ensureDay(attDate);
  day.locked = !day.locked;
  save();
  renderAttendance();
  toast(day.locked ? "Day locked 🔒" : "Day unlocked", "info");
}
function setRegisterMonth(v){
  if (!v) return;
  attRegisterMonth = v;
  renderAttendance();
}
function toggleRegister(){
  attRegisterOpen = !attRegisterOpen;
  renderAttendance();
}

function renderAttendance(){
  if (!data.students.length) {
    document.getElementById("attendance").innerHTML = `
      <div class="section-info">✅ <b>Attendance.</b> Add students first, then come back to mark attendance.</div>
      <div class="card"><div class="empty-state"><span class="icon">🎓</span>No students yet. Go to the Students tab to add them.</div></div>`;
    return;
  }

  const key = attDate;
  const day = data.attendance[key];
  const c = countDay(key);
  const locked = !!(day && day.locked);
  const isHoliday = !!(day && day.holiday);
  const buttonsDisabled = locked || isHoliday;
  const isToday = key === todayKey();

  const summaryStats = isHoliday
    ? `<div class="att-summary">
        <div class="stat"><b>${c.total}</b>Total</div>
        <div class="stat holiday"><b>🏖</b>Holiday</div>
        <div class="stat"><b>—</b>Present</div>
        <div class="stat"><b>—</b>Absent</div>
      </div>`
    : `<div class="att-summary">
        <div class="stat"><b>${c.total}</b>Total</div>
        <div class="stat present"><b>${c.present}</b>Present</div>
        <div class="stat absent"><b>${c.absent}</b>Absent</div>
        <div class="stat leave"><b>${c.leave}</b>Leave</div>
      </div>`;

  const sorted = getSortedStudents();
  const absentList = day ? sorted.filter(s => day.status[s.id] === "A") : [];
  const leaveList = day ? sorted.filter(s => day.status[s.id] === "L") : [];

  let panelHTML = "";
  if (isHoliday) {
    panelHTML = `<div class="att-holiday-box">🏖 <b>Holiday</b> — this day is not counted in attendance percentages.</div>`;
  } else if (!day) {
    panelHTML = `<div class="notice">📝 Attendance not taken yet. Tap <b>A</b> on absentees, <b>L</b> for leave, or press <b>Mark All Present</b> if everyone is here.</div>`;
  } else {
    if (absentList.length) {
      panelHTML += `<div class="att-absent-box"><b>❌ Absent (${absentList.length}):</b> ${absentList.map(s=>`Roll ${esc(s.rollNo||"—")} — ${esc(s.name||"—")}`).join(" • ")}</div>`;
    }
    if (leaveList.length) {
      panelHTML += `<div class="att-leave-box"><b>🏖 Leave — Excused (${leaveList.length}):</b> ${leaveList.map(s=>`Roll ${esc(s.rollNo||"—")} — ${esc(s.name||"—")}`).join(" • ")}</div>`;
    }
    if (!absentList.length && !leaveList.length) {
      panelHTML += `<div class="att-ok-box">✅ <b>Everyone present.</b></div>`;
    }
  }

  const studentRows = sorted.map(s => {
    const st = getStatus(key, s.id);
    const dis = buttonsDisabled ? "disabled" : "";
    const cls = v => `att-btn ${st === v ? "active-" + v.toLowerCase() : ""}`;
    return `<div class="att-student-row">
      <div class="att-student-info">
        <div><span class="att-student-roll">Roll ${esc(s.rollNo||"—")}</span><span class="att-student-name" title="Tap to see yearly summary" onclick="openStudentSummary('${esc(s.id)}')">${esc(s.name||"(no name)")}</span></div>
        ${s.fatherName ? `<div class="att-student-father">s/o ${esc(s.fatherName)}</div>` : ""}
      </div>
      <div class="att-cell">
        <button class="${cls("P")}" type="button" ${dis} onclick="setStatus('${esc(s.id)}','P')" title="Present">P</button>
        <button class="${cls("A")}" type="button" ${dis} onclick="setStatus('${esc(s.id)}','A')" title="Absent">A</button>
        <button class="${cls("L")}" type="button" ${dis} onclick="setStatus('${esc(s.id)}','L')" title="Leave (excused, not counted against %)">L</button>
      </div>
    </div>`;
  }).join("");

  const lockChip = locked ? ` <span class="att-chip">🔒 Locked</span>` : "";
  const holChip = isHoliday ? ` <span class="att-chip" style="background:#E8F0F7;color:#1E4D6B;border-color:#2E5A8A">🏖 Holiday</span>` : "";

  document.getElementById("attendance").innerHTML = `
    <div class="section-info">✅ <b>Attendance.</b> Everyone is marked <b>Present (P)</b> by default. Tap <b>A</b> for absent, or <b>L</b> for excused leave (does not count against %). Tap a <b>student's name</b> to see their yearly summary. Saved automatically.</div>

    <div class="card no-print">
      <div class="att-datebar">
        <button type="button" onclick="shiftDate(-1)" title="Previous day">‹</button>
        <input type="date" value="${esc(key)}" max="${esc(todayKey())}" onchange="setAttDate(this.value)">
        <button type="button" onclick="shiftDate(1)" title="Next day" ${isToday?'disabled':''}>›</button>
        <button type="button" class="${isToday?'primary':''}" onclick="goToday()">Today</button>
      </div>
      <div class="att-date-label" style="margin-top:10px">${esc(prettyDate(key))}${lockChip}${holChip}</div>
      <div class="att-day-toggles">
        <button type="button" class="${isHoliday?'toggled-on':''}" onclick="toggleHoliday()" ${locked?"disabled":""}>🏖 ${isHoliday?"Holiday: ON (whole class)":"Mark Class Holiday"}</button>
        <button type="button" class="${locked?'toggled-on':''}" onclick="toggleLock()">${locked?"🔒 Locked":"🔓 Lock Day"}</button>
        <button type="button" onclick="openBulkHoliday()">📅 Bulk Holiday Range…</button>
      </div>
    </div>

    <div class="card no-print">
      ${summaryStats}
      <div style="margin-top:10px">${panelHTML}</div>
      <div class="actions" style="margin-top:12px">
        <button class="add" onclick="markAllPresent()" ${buttonsDisabled?"disabled":""}>✓ Mark All Present</button>
        <button class="remove" onclick="resetDay()" ${!day?"disabled":""}>🔄 Reset Day</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Students (${sorted.length})</h3>
      <div class="muted" style="margin-bottom:6px"><b>P</b> = Present • <b>A</b> = Absent • <b>L</b> = Leave (excused, not counted against %) • Tap a name for yearly summary</div>
      ${studentRows}

    <div class="card no-print">
      <h3 style="margin-top:0">Reports</h3>
      <div class="actions">

        <button onclick="toggleRegister()">${attRegisterOpen?"Hide":"📊 Show"} Monthly Register</button>
        <button onclick="printRegister()">🖨 Print Register</button>
      </div>
      ${attRegisterOpen ? `
        <div style="margin-top:10px">
          <label>Month</label>
          <input type="month" value="${esc(attRegisterMonth)}" max="${esc(todayKey().slice(0,7))}" onchange="setRegisterMonth(this.value)" style="width:auto;max-width:200px">
        </div>
        ${registerHTML()}
      ` : ""}
    </div>`;
}

function registerHTML(){
  const [y, m] = attRegisterMonth.split("-").map(Number);
  const days = getMonthDays(y, m-1);
  const sorted = getSortedStudents();
  const today = todayKey();

  const headCells = days.map(k => {
    const d = parseInt(k.slice(-2), 10);
    const wd = parseKey(k).getDay();
    const wknd = (wd === 0 || wd === 6) ? " weekend" : "";
    return `<th class="${wknd.trim()}">${d}</th>`;
  }).join("");

  const rows = sorted.map(s => {
    const stats = studentMonthStats(s, attRegisterMonth);
    const joinKey = s.createdAt ? dateKey(new Date(s.createdAt)) : null;
    const cells = days.map(k => {
      if (k > today) return `<td class="empty">·</td>`;
      if (joinKey && k < joinKey) return `<td class="empty">·</td>`;
      const day = data.attendance[k];
      if (!day) return `<td class="empty">·</td>`;
      let st;
      if (day.holiday) st = "H";
      else st = day.status[s.id] || "P";
      const cls = st === "A" ? "a" : st === "L" ? "l" : st === "H" ? "h" : "p";
      return `<td class="${cls}">${st}</td>`;
    }).join("");
    return `<tr>
      <td>${esc(s.rollNo||"—")}</td>
      <td style="text-align:left;padding-left:6px">${esc(s.name||"—")}</td>
      ${cells}
      <td class="total-col"><b>${stats.p}</b></td>
      <td class="total-col">${stats.a}</td>
      <td class="total-col">${stats.l}</td>
      <td class="total-col">${stats.pct}%</td>
    </tr>`;
  }).join("");

  return `<div class="att-reg-wrap"><table class="att-reg">
    <thead><tr>
      <th>Roll</th><th style="min-width:120px">Name</th>${headCells}
      <th class="total-col">P</th><th class="total-col">A</th><th class="total-col">L</th><th class="total-col">%</th>
    </tr></thead>
    <tbody>${rows || `<tr><td colspan="${days.length+6}">No students</td></tr>`}</tbody>
  </table></div>
  <div class="muted" style="margin-top:6px">% = P / (P+A) • Leave (L) and Class Holiday (H) are excluded • <span style="color:#DAD3C3">·</span> = not taken / before joining</div>`;
}

function printAbsenteeSlip(){
  const key = attDate;
  const day = data.attendance[key];
  const sorted = getSortedStudents();

  const absentList = day ? sorted.filter(s => day.status[s.id] === "A") : [];
  const leaveList = day ? sorted.filter(s => day.status[s.id] === "L") : [];

  let bodyHTML = "";
  if (day && day.holiday) {
    bodyHTML = `<div class="no-absents">🏖 This day was marked as a Class Holiday.</div>`;
  } else if (!absentList.length && !leaveList.length) {
    bodyHTML = `<div class="no-absents">✅ All students were present.</div>`;
  } else {
    const rows = [];
    absentList.forEach((s, i) => rows.push({ idx: i+1, s, status: "Absent" }));
    leaveList.forEach((s, i) => rows.push({ idx: absentList.length + i + 1, s, status: "Leave (Excused)" }));
    bodyHTML = `<table>
      <thead><tr>
        <th style="width:5%">#</th>
        <th style="width:8%">Roll</th>
        <th style="width:20%">Name</th>
        <th style="width:20%">Father Name</th>
        <th style="width:23%">Phone</th>
        <th style="width:24%">Status</th>
      </tr></thead>
      <tbody>${rows.map(r => `

/* ---------- Save Absentee Slip as PNG ---------- */
async function downloadAbsenteeSlipImage(){
  const key = attDate;
  const day = data.attendance[key];
  const sorted = getSortedStudents();

  const absentList = day ? sorted.filter(s => day.status[s.id] === "A") : [];
  const leaveList = day ? sorted.filter(s => day.status[s.id] === "L") : [];
  const isHoliday = !!(day && day.holiday);
  const noAbsentees = !absentList.length && !leaveList.length;

  const scale = 2;
  const F = "Arial, Helvetica, sans-serif";
  let logoImg = null;
  if (data.schoolLogo) { try { logoImg = await loadImage(data.schoolLogo); } catch(e) { logoImg = null; } }

  const pad = 30;
  const headerH = 140;
  const headRowH = 54;
  const rowH = 56;
  const dateH = 30;
  const statsH = (day && !day.holiday) ? 26 : 0;

  const colWidths = [50, 80, 220, 220, 150, 150];
  const tableW = colWidths.reduce((a,b)=>a+b, 0);
  const totalW = pad*2 + tableW;

  const total = sorted.length;
  const present = total - absentList.length - leaveList.length;

  const dataRows = (isHoliday || noAbsentees) ? 0 : (absentList.length + leaveList.length);
  const tableH = (isHoliday || noAbsentees) ? 60 : (headRowH + dataRows * rowH);
  const statsExtraH = (day && !day.holiday) ? 70 : 0;
  const totalH = pad*2 + headerH + dateH + tableH + statsExtraH + 30;

  const canvas = document.createElement("canvas");
  canvas.width = totalW * scale;
  canvas.height = totalH * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, totalW, totalH);
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";

  let textLeftBound = pad;
  if (logoImg) {
    const maxLogoH = 60, maxLogoW = 60;
    const ratio = Math.min(maxLogoW / logoImg.width, maxLogoH / logoImg.height);
    const drawW = logoImg.width * ratio;
    const drawH = logoImg.height * ratio;
    ctx.drawImage(logoImg, pad, pad + (headerH - 60)/2, drawW, drawH);
    textLeftBound = pad + drawW + 12;
  }
  const textRightBound = totalW - pad;
  const centerX = (textLeftBound + textRightBound) / 2;
  let y = pad;
  ctx.fillStyle = "#000";
  ctx.font = `700 22px ${F}`;
  ctx.fillText(data.schoolName, centerX, y + 16);
  y += 32;
  const classSub = data.className ? `Class: ${data.className}` : "";
  const inchargeSub = data.inchargeName ? `Incharge: ${data.inchargeName}` : "";
  const line1 = [classSub, inchargeSub].filter(Boolean).join(" • ");
  if (line1) { ctx.font = `700 13px ${F}`; ctx.fillStyle = "#333"; ctx.fillText(line1, centerX, y + 8); y += 22; }
  if (data.academicYear) { ctx.font = `600 12px ${F}`; ctx.fillStyle = "#555"; ctx.fillText(data.academicYear, centerX, y + 8); y += 20; }
  ctx.font = `700 14px ${F}`; ctx.fillStyle = "#1e3a8a"; ctx.fillText("ABSENTEE SLIP", centerX, y + 12);
  y = pad + headerH;

  ctx.font = `700 13px ${F}`; ctx.fillStyle = "#000";
  ctx.fillText(prettyDate(key), centerX, y + 15);
  y += dateH;

  // NOTE: stats line is now drawn AFTER the table (see end of this function)

  if (isHoliday) {
    ctx.font = `700 18px ${F}`; ctx.fillStyle = "#1E4D6B";
    ctx.fillText("This day was marked as a Class Holiday.", centerX, y + 30);
  } else if (noAbsentees) {
    ctx.font = `700 18px ${F}`; ctx.fillStyle = "#1E4D6B";
    ctx.fillText("All students were present.", centerX, y + 30);
  } else {
    const headers = ["#", "Roll", "Name", "Father Name", "Phone", "Status"];
    ctx.fillStyle = "#e5e7eb"; ctx.fillRect(pad, y, tableW, headRowH);
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
    let x = pad;
    ctx.fillStyle = "#000"; ctx.font = `700 16px ${F}`;
    headers.forEach((h, i) => { ctx.strokeRect(x, y, colWidths[i], headRowH); ctx.fillText(h, x + colWidths[i]/2, y + headRowH/2); x += colWidths[i]; });
    y += headRowH;

    const allRows = [];
    absentList.forEach((s, i) => allRows.push({ idx: i+1, s, status: "Absent" }));
    leaveList.forEach((s, i) => allRows.push({ idx: absentList.length + i + 1, s, status: "Leave (Excused)" }));

    allRows.forEach((row, idx) => {
      x = pad;
      ctx.fillStyle = idx % 2 === 0 ? "#ffffff" : "#f8fafc";
      ctx.fillRect(pad, y, tableW, rowH);
      ctx.strokeStyle = "#000"; ctx.fillStyle = "#000"; ctx.font = `600 15px ${F}`;
      const cells = [
        String(row.idx),
        row.s.rollNo || "—",
        row.s.name || "—",
        row.s.fatherName || "—",
        row.s.phone || "—",
        row.status
      ];
      cells.forEach((val, i) => {
        ctx.strokeRect(x, y, colWidths[i], rowH);
        if (i === 2 || i === 3) {
          ctx.textAlign = "left";
          const maxW = colWidths[i] - 10;
          const words = String(val).split(/\s+/);
          let line = "", lines = [];
          words.forEach(w => {
            const test = line ? line + " " + w : w;
            if (ctx.measureText(test).width <= maxW) line = test;
            else { if (line) lines.push(line); line = w; }
          });
          if (line) lines.push(line);
          if (lines.length > 2) lines = lines.slice(0, 2);
          const lineH = 17;
          const totalTextH = lines.length * lineH;
          const startY = y + rowH/2 - totalTextH/2 + lineH/2 - 1;
          lines.forEach((ln, li) => ctx.fillText(ln, x + 5, startY + li * lineH));
          ctx.textAlign = "center";
        } else {
          ctx.fillText(val, x + colWidths[i]/2, y + rowH/2);
        }
        x += colWidths[i];
      });
      y += rowH;
    });
  }

  // Draw the big stats line below the table
  if (day && !day.holiday) {
    y += 40;
    ctx.font = `800 18px ${F}`;
    ctx.fillStyle = "#000";
    ctx.fillText(`Total: ${total}   •   Present: ${present}   •   Absent: ${absentList.length}   •   Leave: ${leaveList.length}`, centerX, y);
    y += 30;
  }

  canvas.toBlob(blob => {
    if (!blob) { toast("Could not create image.", "error"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const safeDate = key.replace(/[^\d-]/g, "");
    a.download = `absentee-slip-${safeDate}.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast("Slip saved as image.", "success");
  }, "image/png");
}

function printRegister(){
  const [y, m] = attRegisterMonth.split("-").map(Number);
  const days = getMonthDays(y, m-1);
  const sorted = getSortedStudents();
  if (!sorted.length) { toast("No students.", "error"); return; }
  const today = todayKey();

  const headCells = days.map(k => `<th>${parseInt(k.slice(-2),10)}</th>`).join("");
  const rows = sorted.map(s => {
    const stats = studentMonthStats(s, attRegisterMonth);
    const joinKey = s.createdAt ? dateKey(new Date(s.createdAt)) : null;
    const cells = days.map(k => {
      if (k > today) return `<td class="empty"></td>`;
      if (joinKey && k < joinKey) return `<td class="empty"></td>`;
      const day = data.attendance[k];
      if (!day) return `<td class="empty"></td>`;
      let st;
      if (day.holiday) st = "H";
      else st = day.status[s.id] || "P";
      const cls = st === "A" ? "a" : st === "L" ? "l" : st === "H" ? "h" : "";
      return `<td class="${cls}">${st}</td>`;
    }).join("");
    return `<tr>
      <td>${esc(s.rollNo||"—")}</td>
      <td class="left" style="text-align:left;padding-left:1mm">${esc(s.name||"—")}</td>
      ${cells}
      <td class="total-col">${stats.p}</td>
      <td class="total-col">${stats.a}</td>
      <td class="total-col">${stats.l}</td>
      <td class="total-col">${stats.pct}%</td>
    </tr>`;
  }).join("");

  setPrint(`<div class="print-sheet">
    ${buildPrintHeaderHTML("Monthly Attendance Register")}
    <div class="print-sub2" style="font-weight:700">Month: ${esc(prettyMonth(attRegisterMonth))}</div>
    <div class="print-sub2" style="font-size:9pt;margin-top:1mm">P = Present • A = Absent • L = Leave (excused) • H = Class Holiday • % = P / (P+A)</div>
    <div style="margin-top:3mm"></div>
    <table class="reg-table">
      <colgroup>
        <col style="width:11mm">
        <col style="width:38mm">
        ${days.map(()=>'<col style="width:4.6mm">').join("")}
        <col style="width:7mm"><col style="width:7mm"><col style="width:7mm"><col style="width:11mm">
      </colgroup>
      <thead><tr>
        <th>Roll</th><th>Name</th>${headCells}
        <th class="total-col">P</th><th class="total-col">A</th><th class="total-col">L</th><th class="total-col">%</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`, "landscape");
}

async function createAssessment(){

function openCopyPicker(id){ copyPickerOpenFor = copyPickerOpenFor === id ? null : id; renderResults(); }
function copySubjectsFrom(sourceId){
  if (!activeAssessmentId) return;
  const target = getAssessmentById(activeAssessmentId);
  const source = getAssessmentById(sourceId);
  if (!target || !source) return;
  const existing = new Set(target.subjects.map(s => s.name.toLowerCase()));
  let added = 0;
  source.subjects.forEach(s => {
    if (existing.has(s.name.toLowerCase())) return;
    target.subjects.push({ id: newAssessSubId(), name: s.name, max: s.max });
    added++;
  });
  save();
  copyPickerOpenFor = null;

  toast(added ? `Copied ${added} subject${added===1?'':'s'}.` : "All subjects already exist.", added ? "success" : "info");

function onMarkInput(e, sid, subId){
  if (!activeAssessmentId) return;
  const el = e.target;
  let raw = el.value.trim();
  if (raw === "") {
    setAssessmentRawMark(activeAssessmentId, sid, subId, "");
  } else if (/^a$/i.test(raw)) {
    setAssessmentRawMark(activeAssessmentId, sid, subId, "A");
    el.value = "A";
  } else {
    const n = Number(raw);
    if (!isNaN(n) && n >= 0) {
      setAssessmentRawMark(activeAssessmentId, sid, subId, n);
    } else {
      el.value = "";
      setAssessmentRawMark(activeAssessmentId, sid, subId, "");
    }
  }
  quickSave();
  const isAbsent = el.value.trim().toUpperCase() === "A";
  document.querySelectorAll(`.a-btn[data-sid="${sid}"][data-subid="${subId}"]`).forEach(b => b.classList.toggle("on", isAbsent));
  updateRowComputed(sid);
  scheduleRankUpdate();
}
function onMarkBlur(e, sid, subId){
  save();
  const el = e.target;
  const raw = el.value.trim();
  el.classList.toggle("empty", raw === "");
  el.classList.toggle("absent", raw === "A" || raw === "a");
  if (raw !== "" && raw !== "A" && raw !== "a") {
    const a = getAssessmentById(activeAssessmentId);
    const sub = a ? a.subjects.find(x => x.id === subId) : null;
    const max = sub ? Number(sub.max) : 0;
    const n = Number(raw);
    el.classList.toggle("overmax", !isNaN(n) && max > 0 && n > max);
  } else {
    el.classList.remove("overmax");
  }
  el.value = (raw === "a") ? "A" : raw;
}
function toggleAbsent(sid, subId){
  if (!activeAssessmentId) return;
  const cur = getAssessmentRawMark(activeAssessmentId, sid, subId);
  const next = (cur === "A") ? "" : "A";
  setAssessmentRawMark(activeAssessmentId, sid, subId, next);
  save();
  document.querySelectorAll(`input[data-sid="${sid}"][data-subid="${subId}"]`).forEach(inp => {
    inp.value = next;
    inp.classList.toggle("empty", next === "");

    inp.classList.remove("overmax");
  });

function onMarksKeydown(e, sid, subId){

    moveFocusVertical(sid, subId, e.shiftKey ? -1 : 1);
    return false;

function moveFocusVertical(sid, subId, dir){

  const target = sorted[idx + dir];

}
let rankUpdateTimer = null;
function scheduleRankUpdate(){
  if (rankUpdateTimer) clearTimeout(rankUpdateTimer);
  rankUpdateTimer = setTimeout(() => { rankUpdateTimer = null; updateAllComputed(); }, 400);
}
function updateRowComputed(sid){
  if (!activeAssessmentId) return;
  const a = getAssessmentById(activeAssessmentId);
  const s = data.students.find(x => x.id === sid);
  if (!a || !s) return;
  const r = calcAssessmentResult(s, a);
  const row = document.querySelector(`.res-wrap tr[data-rid="${sid}"]`);
  if (row) {
    const totalEl = row.querySelector(".total");
    const pctEl = row.querySelector(".pct");
    const resultEl = row.querySelector(".result-cell");
    if (totalEl) totalEl.textContent = r.total + (r.maxTotal ? " / " + r.maxTotal : "");
    if (pctEl) {
      pctEl.textContent = r.maxTotal > 0 ? r.pct + "%" : "—";
      pctEl.classList.remove("pct-green","pct-amber","pct-red");
      if (r.maxTotal > 0) {
        if (r.pct >= 80) pctEl.classList.add("pct-green");
        else if (r.pct >= (Number(a.passPercent)||40)) pctEl.classList.add("pct-amber");
        else pctEl.classList.add("pct-red");
      }
    }
    if (resultEl) resultEl.innerHTML = resultCellHTML(s, r, a);
    row.classList.toggle("fail", !r.passed && r.maxTotal > 0);
    if (pctEl) pctEl.classList.toggle("fail-pct", !r.passed && r.maxTotal > 0);
    r.subMarks.forEach(sm => {
      const cell = row.querySelector(`td.marks-cell[data-subid="${sm.subId}"]`);
      if (cell) cell.classList.toggle("below33", sm.below33);
    });
  }
}
function updateAllComputed(){
  if (!document.getElementById("results").classList.contains("on")) return;
  if (!activeAssessmentId) return;
  const ranked = computeAssessmentRanking(activeAssessmentId);
  const rankMap = {};
  ranked.forEach(x => { rankMap[x.s.id] = x.rank; });
  document.querySelectorAll(".res-wrap tbody tr[data-rid]").forEach(tr => {
    const sid = tr.dataset.rid;
    const rankEl = tr.querySelector(".rank");
    if (rankEl) rankEl.textContent = rankMap[sid] ? ordinal(rankMap[sid]) : "—";
  });
}
function resultCellHTML(s, r, a){
  if (r.maxTotal === 0) return `<span class="muted">—</span>`;
  if (r.passed) {
    const suffix = r.manual && !r.computedPass ? ` <span title="Manually passed" style="color:#7A5515">✱</span>` : "";
    const undoBtn = (r.manual) ? `<button class="undo-btn" type="button" onclick="toggleManualPass('${esc(s.id)}')" title="Remove manual pass">Undo</button>` : "";
    return `<span class="pass-txt">PASS</span>${suffix}${undoBtn}`;
  } else {
    return `<span class="fail-txt">FAIL</span> <button class="manual-btn" type="button" onclick="toggleManualPass('${esc(s.id)}')" title="Pass this student anyway">Pass anyway</button>`;
  }
}
function toggleManualPass(sid){
  if (!activeAssessmentId) return;
  if (!data.assessmentManualPass[activeAssessmentId]) data.assessmentManualPass[activeAssessmentId] = {};
  const cur = !!data.assessmentManualPass[activeAssessmentId][sid];
  if (cur) delete data.assessmentManualPass[activeAssessmentId][sid];
  else data.assessmentManualPass[activeAssessmentId][sid] = true;
  save();
  const a = getAssessmentById(activeAssessmentId);
  const s = data.students.find(x => x.id === sid);
  if (!a || !s) return;
  const r = calcAssessmentResult(s, a);
  const row = document.querySelector(`.res-wrap tr[data-rid="${sid}"]`);
  if (row) {
    row.classList.toggle("fail", !r.passed && r.maxTotal > 0);
    const pctEl = row.querySelector(".pct");
    if (pctEl) pctEl.classList.toggle("fail-pct", !r.passed && r.maxTotal > 0);
    const resultEl = row.querySelector(".result-cell");
    if (resultEl) resultEl.innerHTML = resultCellHTML(s, r, a);
  }
  toast(cur ? "Manual pass removed." : "Student marked as passed.", "success");
}

function renderResults(){

    document.getElementById("results").innerHTML = `
      <div class="section-info">📊 <b>Results.</b> Add students first, then create an assessment.</div>

  } else {
